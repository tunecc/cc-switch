, \"show\", f\"HEAD:{path}\"])\n    if \"4.0.25-1\" not in body:\n        fail(f\"version file not bumped in {path}\")\n\nmarkers = sh([\"git\", \"grep\", \"-I\", \"-l\", \"-e\", \"^<<<<<<< \", \"-e\", \"^>>>>>>> \", \"HEAD\", \"--\", \"src\", \"src-tauri\", \"tests\", \"docs\", \"README.md\"], allow_none=True)\nif markers.strip():\n    fail(f\"conflict markers remain: {markers.splitlines()[:3]}\")\n\nprint(\n    \"CHECK-PASS fidelity A=%d(4 version lines) B=%d version+doc rows=%d non-overlap files=%d all-clean\"\n    % (total_a, total_b, sum(missing_b.get(\"docs/HOW_TO_REBASE_UPSTREAM.md\", Counter()).values()), len(non_overlap))\n)\n"],"cwdRef":".","executable":"python3","id":"V2","name":"只读取证脚本：fork 保留/移除清单 + 5 locale 查重 + tr.json 逐字节 + 版本与依赖一致性 + 四 ref 落地保真复算","repeatable":true,"timeoutMs":600000}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"13e3c3a618ac87b42523c3f3c1a51228a127ea9f54034bbc45699b0f4080fbcf","outcomeId":"builder5-7e729550-7e7a-4a73-9788-8d773b78c790"}],"reconciliations":[],"ref":"native-builder","requiredCapabilities":[],"retry":"manual","runId":"sync-upstream-v425","status":"succeeded","stepId":"build.builder","type":"handoff"},{"attempt":1,"claim":{"executorId":"comet-native-checks","token":"portable-fadc2f0d2803474e450b8dabbac1406e6fc30ca02559bbb6317e50abe4c55098"},"executionOrigin":{"workflow":{"hash":"20c0b8f15998b9da37fbed5b602f669f2a5c7a91f576d5683229c7c5a445a6be","id":"comet-native","version":"1"}},"executionStop":{"actionId":"sync-upstream-v425:17","attempt":1,"claimToken":"portable-fadc2f0d2803474e450b8dabbac1406e6fc30ca02559bbb6317e50abe4c55098","evidence":"Runtime 已确认原受管执行停止；执行记录摘要 5eb22a8fffcfd67f5507784d7a885645dce493f1a54e7ead934044d8e41f81ae","inputHash":"ce5427ae1802970b31fe00e59af228c41a76f88e9474f2a849396e08af1baa36"},"id":"sync-upstream-v425:17","input":{"input":{"artifactRootRef":"docs","name":"sync-upstream-v425"},"outputs":{}},"inputHash":"ce5427ae1802970b31fe00e59af228c41a76f88e9474f2a849396e08af1baa36",