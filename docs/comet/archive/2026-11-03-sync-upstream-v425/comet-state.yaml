f）；Codex 额度提前保护、汇率自动获取、路由/stack 模型描述、托盘先显示后填数据（panel_visible 恰 +10/−0、左键契约与护栏不动）、浏览器请求防护、Windows 禁 WebView2 自动填充、Codex 子 agent 并发上限、Kimi 会话删除、Skills 工具栏、models.dev 走后端、pwsh 优先、GPT-6.1 Terra 全部落地；随上游删除 .github/dependabot.yml 与 DIT.ai 物料；SCHEMA_VERSION fork 保持 25（上游 v4.0.24 与 v4.0.25 同为 24，无迁移臂合并）。\n本机实测口径已按 Verifier 指正统一：cargo test 4691 通过 / 11 ignored / 0 失败；services::mcp_connectivity::tests 11 条；四 ref 保真复算方向 A 缺 4 行（四个版本行）、非重叠 98 个上游文件缺 0、方向 B 缺 24 行（4 版本行 + 20 条 §4 登记行改写）。Build/Verify 期间不做任何远端写。","verificationChecks":[{"argv":["fmt","--check","--manifest-path","src-tauri/Cargo.toml"],"cwdRef":".","executable":"cargo","id":"V1","name":"cargo fmt --check（秒级只读）","repeatable":true,"timeoutMs":300000},{"argv":["-c","import json\nimport subprocess\nimport sys\nfrom collections import Counter\nimport re\nimport os\n\nBASE = \"v4.0.24\"\nTARGET = \"v4.0.25\"\nPRESYNC = \"pre-sync-v425\"\nNOISE = re.compile(r\"^[^\\w\\u4e00-\\u9fff]*$\")\n\n\ndef sh(args, allow_none=False):\n    r = subprocess.run(args, capture_output=True, text=True)\n    if r.returncode not in (0, 1 if allow_none else -1):\n        raise SystemExit(f\"CHECK-FAILED: command failed: {args[:4]}\")\n    if allow_none and r.returncode == 1 and not r.stdout.strip():\n        return \"\"\n    if r.returncode not in (0,):\n        if allow_none:\n            return r.stdout\n        raise SystemExit(f\"CHECK-FAILED: command failed: {args[:4]}\")\n    return r.stdout\n\n\ndef norm(line):\n    text = line.strip()\n    if text.endswith(\",\"):\n        text = text[:-1]\n    return text\n\n\ndef keep(text):\n    return bool(text) and not NOISE.match(text)\n\n\ndef added(ref_a, ref_b, path):\n    out = sh([\"git\", \"diff\", f\"{ref_a}..{ref_b}\", \"--\", path])\n    return [\n        norm(r[1:])\n        for r in out.splitlines()\n        if r.startswith(\"+\") and not r.startswith(\"+++\") and keep(norm(r[1:]))\n    ]\n\n\ndef blob(path):\n    try:\n        out = subprocess.run(\n            [\"git\", \"show\", f\"