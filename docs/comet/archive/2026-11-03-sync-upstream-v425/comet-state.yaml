右键置顶/置底、无更新器与无 `stream_check` 接线，逐项以 `git grep -I` 取证并跑对应测试。"},{"id":"A3","source":"brief.md","text":"上游 MCP 按需连通性检测与 fork 的供应商逐模型连通性测试按 D14（两者并存）同时生效且互不干扰：上游侧 `services/mcp_connectivity.rs`（含 `tests.rs`）、`commands/mcp.rs` 两个命令、`useMcpConnectivity.ts`、`UnifiedMcpPanel.tsx` 接线与 `mcp_connectivity_server.rs` fixture、`tests/hooks/useMcpConnectivity.test.tsx`、`tests/components/UnifiedMcpPanel.test.tsx` 用例齐备；`lib.rs` 的 `invoke_handler` 同时含上游的 `start/cancel_mcp_connectivity_checks` 与 fork 的 `connectivity_test_provider_models`/`connectivity_probe_provider` 四个注册，且 `stream_check_provider` 保持 0 命中；两条链路的 locale 键段（上游 `mcp` 段与 fork `connectivityTest`/`provider.connectivityCheck`）互不覆盖。"},{"id":"A4","source":"brief.md","text":"Codex 额度提前保护与汇率自动获取两条新链路完整落地：`proxy/codex_quota_protection.rs`、`settings.rs` 的 `CodexQuotaProtection`（默认 `enabled: false`、阈值 95/98、1..=99 校验）、`CodexQuotaProtectionSettings.tsx` 与上游用例，以及 `services/exchange_rates.rs`、`useAutoExchangeRates.ts`、`tests/hooks/useAutoExchangeRates.test.tsx` 与 `tests/msw/handlers.ts` 接线全部生效；fork 的 `settings.rs` `VisibleSidebarPanels` 字段段与上游新增并存。"},{"id":"A5","source":"brief.md","text":"托盘新行为与 fork 左键契约共存：上游 `tray_panel.rs` 的 `place()` 新增 `texts` 参数、`PanelPlacement.texts` 与 `tray_panel_state` 只返回 `PanelModel` 的改造取上游，`src/tray-panel/TrayPanel.tsx` 与 `api.ts` 整文件随上游；fork 的 `panel_visible()` 插入仍在位，`TrayIconEvent::Click` 四分支、`set_show_menu_on_left_click(false)` 与 `tray_left_click_never_opens_the_menu` 护栏不变（本轮上游未触碰点击处理），`tests/components/TrayPanel.test.tsx` 上游新增用例与既有全量用例通过。"},{"id":"A6","source":"brief.md","text":"路由/stack 模式模型描述新键与 fork 模型徽章共存：`live/project/claude.rs`、`mode/{contract,controller,stack}.rs`、`claude_desktop_config.rs` 写出的 `ANTHROPIC_DEFAULT_*_MODEL_DESCRIPTION` 与 `stack::provider_model_description` 落地，`src/utils/providerModelUtils.ts` 仍按精确键名读 `*_MODEL` 而不把描述键当模型字段，fork 快捷切换改写档位后上游描述随 live 配置重写刷新（不残留过期 provider 名）。"},{"id":"A7","source":"brief.md","text":"浏览器请求防护不影响 fork 链路：`proxy/browser_guard.rs` + `proxy/server.rs` 的 Origin/Host 校验取上游后，fork 的连通性测试（后端 reqwest+SSE 直连、不经浏览器、不带 Origin）与 DevPanel 仍工作，`pnpm test:unit` 与后端测试无因该防护新增的失败。"},{"id":"A8","source":"brief.md","text":"数据库与 schema 结论可复算：终态 `SCHEMA_VERSION` 为 25（fork 值），迁移臂数量与 `pre-sync-v425` 相同（本轮不新增臂），`schema.rs` 的 GPT-6.1 Terra 价格种子落地，`database/{schema,tests}.rs` 全部用例通过且上游用例断言不含 `24`。"},{"id":"A9","source":"brief.md","text":"本地化落地且零静默失效：4 个既有 locale 的上游新增键逐字落地、改写按上游、DIT.ai 的 `dit` 文案键零残留，fork 键段与 `provider.connectivityCheck`、`settings.general.trayStyleHelp` 保留；`tr.json` 与 `v4.0.25` tag 逐字节一致且不补 fork 键；5 个 locale 按对象作用域显式查重结果为 `dup=0`。"},{"id":"A10","source":"brief.md","text":"后端在 fork 结构下编译通过：上游新增的 `Provider` 结构体字面量（含 `media_sanitizer.rs`、`codex_quota_protection.rs`、`mcp_connectivity` 测试等本轮新增处）补齐 fork 的 `website_url_2` 字段后，`cargo check --all-targets` 与 `cargo nextest run` 零失败、无新增未使用告警，且 `cargo fmt --check` 通过。"},{"id":"A11","source":"brief.md","text":"版本与锁文件终态一致：四处版本号均为 `4.0.25-1`，`git diff --numstat pre-sync-v425 HEAD` 对四个文件符合本轮口径；`Cargo.lock` 不出现任何 `tauri-plugin-updater` 条目且含上游新增的 `rmcp`、`process-wrap`、`webview2-com`、`windows` 与 dev `tokio` test-util 依赖树，`pnpm-lock.yaml` 反映 `smol-toml` 1.9.1 而 fork 移除的 `@tauri-apps/plugin-updater` 三段仍不存在，`pnpm install` 与 `cargo check` 均报告锁文件未被改写。"},{"id":"A12","source":"brief.md","text":"上游物料删除与 fork 保留面一致：`.github/dependabot.yml` 与 `assets/partners/logos/dit-banner.png` 随上游不存在；`git grep -I -n 'farion1231/cc-switch/releases' HEAD -- src-tauri` 仍 0 命中（fork 的 4 处 tunecc URL 与两个测试断言保留）；`.github/workflows/{ci,release}.yml` 保持 fork 裁剪版且 Release 的 macOS runner 仍为 `macos-14`。"},{"id":"A13","source":"brief.md","text":"交付边界与配置保护：Build/Verify 期间不执行任何远端写操作；`.comet/config.yaml` 在 rebase 中途被历史提交改写时按 `git checkout ORIG_HEAD -- .comet/config.yaml` 恢复且终态与同步前一致；终态工作区除 Runtime 自管文件外无未提交改动，`docs/HOW_TO_REBASE_UPSTREAM.md` §4 与 §4.11 反映本轮实测结论。"},{"id":"A14","source":"brief.md","text":"落地保真核对（四 ref 行多重集口径）：在最终态提交之后，用 `v4.0.25` / `main(=pre-sync-v425)` / `HEAD` 与上游基线四个 ref 计算行多重集差集，130 个上游文件与 fork 侧 148 个代码文件全部参与，非重叠的 98 个上游文件在 fork 侧缺失为 0，重叠 32 文件的两侧缺失行逐行归因并带重数，归因只允许「刻意取舍（版本行 / fork 专属文案 / D14 与依赖决定 / 白名单条目）」一类，出现无法归类的缺失行即判定失败。"}],"children":null,"formalHash":"a7d71ef56f8dd94a6c2cf74535c8302f51483a812926df2c191b7c33b1730263","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"6f154a46c1558369d32d279069d8799978f804e8020c360ff735a3bde2a091d0","contractHash":"d585e20cd423198fdfd0c79e021742f78fef8108d052b936c27403c3df016674","inputHash":"218fedf61f5f2c52fc7c2113f23687d3f4ae73dac6d00ef01ed75e156d818c23","legacyFingerprint":"1bd16689b0d7c2d11817595b12ec59b6c62d55a90dd86ef3995ebb96c08ea365","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"d655bf62663874d27944e4f366afceaaa16e3492397df28eff8b5277c292af69","contractHash":"506049c77cafd3b466a82ea0262ff78c7f842e17c066a5f2df21d5ceacc9c097","inputHash":"363b68c1c2b364f0e8f91ea075a2bce5f968cf21ffb84960b4ba4e508f1d6986","legacyFingerprint":"881196bb8dc68bb7349b32d534332534e23d6c87eccaec894c85b9de0d3dd847","source":"specs/upstream-sync/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"3397840c470c542c5f2341d1967d172558bb5ee710c9bc782fe0e466daabca77","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}},"proposalHash":"58cf72223566dec365ba688a219377cee037d7e7c5c56a40d9c1eaa0a2959b32","choices":["approved","rejected"],"results":{},"decision":{"id":"1ffa9e4267c32bafe5e2f283ef0f4bc9b07eba1baadc17c1eecb65eafc216769","choice":"approved","proposalHash":"58cf72223566dec365ba688a219377cee037d7e7c5c56a40d9c1eaa0a2959b32"}},{"id":"sync-upstream-v425:6","stepId":"verify.checks-stop","sequence":6,"status":"resolved","proposal":{"activation":{"failedCheckActionId":"sync-upstream-v425:5"},"input":{"artifactRootRef":"docs","name":"sync-upstream-v425"},"outputs":{"verify.checks":{"candidateId":"23824