ail(f\"conflict markers remain: {markers.splitlines()[:3]}\")\n\nprint(\n    \"CHECK-PASS fidelity A=%d(4 version lines) B=%d version+doc rows=%d non-overlap files=%d all-clean\"\n    % (total_a, total_b, sum(missing_b.get(\"docs/HOW_TO_REBASE_UPSTREAM.md\", Counter()).values()), len(non_overlap))\n)\n"],"cwdRef":".","executable":"python3","id":"V7","name":"fork 保留/移除取证 + 本地化查重 + 四 ref 落地保真复算","repeatable":true,"timeoutMs":900000}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"c7aff6d01454a5b55e0c533a0477cc0dfd0736b831cd206c3d563fe78bbfab32","outcomeId":"builder-1835638d-5908-473f-a545-55b4bf8bc6ec"}],"reconciliations":[],"ref":"native-builder","requiredCapabilities":[],"retry":"manual","runId":"sync-upstream-v425","status":"succeeded","stepId":"build.builder","type":"handoff"},{"attempt":1,"claim":{"executorId":"comet-native-checks","token":"portable-182f4a7a55b07415003ab06699dd828929e04c9a30e4a50903badfc4d2144d19"},"executionOrigin":{"workflow":{"hash":"20c0b8f15998b9da37fbed5b602f669f2a5c7a91f576d5683229c7c5a445a6be","id":"comet-native","version":"1"}},"id":"sync-upstream-v425:5","input":{"input":{"artifactRootRef":"docs","name":"sync-upstream-v425"},"outputs":{}},"inputHash":"6723cb0750e125e5b465b1b082861db82b7cf17fde7acbaed66b39e85cae5699","outcome":{"actionId":"sync-upstream-v425:5","attempt":1,"claimToken":"portable-182f4a7a55b07415003ab06699dd828929e04c9a30e4a50903badfc4d2144d19","inputHash":"6723cb0750e125e5b465b1b082861db82b7cf17fde7acbaed66b39e85cae5699","outcomeId":"sync-upstream-v425:5:1:interrupted-reconciliation:1","output":{"candidateId":"2382455a5c90f68ec887bea0169e55de1c3709255298b843fcde6111f427527b","checks":[{"argvDisplay":["install","--frozen-lockfile"],"cwdRef":".","durationMs":1016,"exitCode":0,"id":"V1","logRef":"native/sdk-checks/eb10a578d93bcdd847ff982a019351978988f1b0a60fe235a4d91cc6a68accb8/logs/checks/857bffc2ecbf9042ff0c442781acb4b20569e1b0a631fdea077b58537ac84510-V1.log","logSha256":"1a7cdcf8b0bb880d38cb2c0f6cdcf9f84