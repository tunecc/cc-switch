            release = sh(["git", "show", "HEAD:.github/workflows/release.yml"])

            if "macos-15" in release:
                fail("Release runner moved to macos-15 against the recorded decision")
            if "- os: macos-14" not in release:
                fail("Release macOS matrix missing macos-14")

            import json as _json



            def dup_count(path):
                dups = []

                def hook(pairs):
                    seen = set()
                    for k, _v in pairs:
                        if k in seen:
                            dups.append(k)
                        seen.add(k)
                    return dict(pairs)

                _json.loads(open(path, encoding="utf-8").read(), object_pairs_hook=hook)
                return len(dups)


            for loc in ["en", "ja", "zh", "zh-TW", "tr"]:
                p = f"src/i18n/locales/{loc}.json"
                n = dup_count(p)
                if n:
                    fail(f"duplicate keys in {p}: {n}")
            tr_up = sh(["git", "show", f"v4.0.25:src/i18n/locales/tr.json"])

            if open("src/i18n/locales/tr.json", encoding="utf-8").read() !=
            tr_up:
                fail("tr.json is not byte-identical with the upstream tag")
            zh = open("src/i18n/locales/zh.json", encoding="utf-8").read()

            if '"dit"' in zh or "checkConnectivity" not in zh:
                fail("zh.json locale state wrong (dit residue or missing upstream mcp key)")
            en = open("src/i18n/locales/en.json", encoding="utf-8").read()

            for key in ["connectivityTest", "devpanel", "trayStyleHelp"]:
