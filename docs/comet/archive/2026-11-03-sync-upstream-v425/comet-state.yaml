ktop_config.rs` 写出的 `ANTHROPIC_DEFAULT_*_MODEL_DESCRIPTION` 与 `stack::provider_model_description` 落地，`src/utils/providerModelUtils.ts` 仍按精确键名读 `*_MODEL` 而不把描述键当模型字段，fork 快捷切换改写档位后上游描述随 live 配置重写刷新（不残留过期 provider 名）。"},{"id":"A7","source":"brief.md","text":"浏览器请求防护不影响 fork 链路：`proxy/browser_guard.rs` + `proxy/server.rs` 的 Origin/Host 校验取上游后，fork 的连通性测试（后端 reqwest+SSE 直连、不经浏览器、不带 Origin）与 DevPanel 仍工作，`pnpm test:unit` 与后端测试无因该防护新增的失败。"},{"id":"A8","source":"brief.md","text":"数据库与 schema 结论可复算：终态 `SCHEMA_VERSION` 为 25（fork 值），迁移臂数量与 `pre-sync-v425` 相同（本轮不新增臂），`schema.rs` 的 GPT-6.1 Terra 价格种子落地，`database/{schema,tests}.rs` 全部用例通过且上游用例断言不含 `24`。"},{"id":"A9","source":"brief.md","text":"本地化落地且零静默失效：4 个既有 locale 的上游新增键逐字落地、改写按上游、DIT.ai 的 `dit` 文案键零残留，fork 键段与 `provider.connectivityCheck`、`settings.general.trayStyleHelp` 保留；`tr.json` 与 `v4.0.25` tag 逐字节一致且不补 fork 键；5 个 locale 按对象作用域显式查重结果为 `dup=0`。"},{"id":"A10","source":"brief.md","text":"后端在 fork 结构下编译通过：上游新增的 `Provider` 结构体字面量（含 `media_sanitizer.rs`、`codex_quota_protection.rs`、`mcp_connectivity` 测试等本轮新增处）补齐 fork 的 `website_url_2` 字段后，`cargo check --all-targets` 与 `cargo nextest run` 零失败、无新增未使用告警，且 `cargo fmt --check` 通过。"},{"id":"A11","source":"brief.md","text":"版本与锁文件终态一致：四处版本号均为 `4.0.25-1`，`git diff --numstat pre-sync-v425 HEAD` 对四个文件符合本轮口径；`Cargo.lock` 不出现任何 `tauri-plugin-updater` 条目且含上游新增的 `rmcp`、`process-wrap`、`webview2-com`、`windows` 与 dev `tokio` test-util 依赖树，`pnpm-lock.yaml` 反映 `smol-toml` 1.9.1 而 fork 移除的 `@tauri-apps/plugin-updater` 三段仍不存在，`pnpm install` 与 `cargo check` 均报告锁文件未被改写。"},{"id":"A12","source":"brief.md","text":"上游物料删除与 fork 保留面一致：`.github/dependabot.yml` 与 `assets/partners/logos/dit-banner.png` 随上游不存在；`git grep -I -n 'farion1231/cc-switch/releases' HEAD -- src-tauri` 仍 0 命中（fork 的 4 处 tunecc URL 与两个测试断言保留）；`.github/workflows/{ci,release}.yml` 保持 fork 裁剪版且 Release 的 macOS runner 仍为 `macos-14`。"},{"id":"A13","source":"brief.md","text":"交付边界与配置保护：Build/Verify 期间不执行任何远端写操作；`.comet/config.yaml` 在 rebase