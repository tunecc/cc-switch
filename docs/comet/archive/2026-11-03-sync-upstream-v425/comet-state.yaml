mmand failed: {args[:4]}\")\n    if allow_none and r.returncode == 1 and not r.stdout.strip():\n        return \"\"\n    if r.returncode not in (0,):\n        if allow_none:\n            return r.stdout\n        raise SystemExit(f\"CHECK-FAILED: command failed: {args[:4]}\")\n    return r.stdout\n\n\ndef norm(line):\n    text = line.strip()\n    if text.endswith(\",\"):\n        text = text[:-1]\n    return text\n\n\ndef keep(text):\n    return bool(text) and not NOISE.match(text)\n\n\ndef added(ref_a, ref_b, path):\n    out = sh([\"git\", \"diff\", f\"{ref_a}..{ref_b}\", \"--\", path])\n    return [\n        norm(r[1:])\n        for r in out.splitlines()\n        if r.startswith(\"+\") and not r.startswith(\"+++\") and keep(norm(r[1:]))\n    ]\n\n\ndef blob(path):\n    try:\n        out = subprocess.run(\n            [\"git\", \"show\", f\"HEAD:{path}\"], capture_output=True, text=True, check=True\n        ).stdout\n    except subprocess.CalledProcessError:\n        return None\n    return Counter(t for t in (norm(l) for l in out.splitlines()) if keep(t))\n\n\ndef changed(ref_a, ref_b):\n    return sh([\"git\", \"diff\", \"--name-only\", f\"{ref_a}..{ref_b}\"]).splitlines()\n\n\ndef fail(msg):\n    print(\"CHECK-FAILED:\", msg)\n    sys.exit(1)\n\n\nup_files = changed(BASE, TARGET)\nfork_files = set(changed(BASE, PRESYNC))\nversion_files = [\n    \"package.json\",\n    \"src-tauri/tauri.conf.json\",\n    \"src-tauri/Cargo.toml\",\n    \"src-tauri/Cargo.lock\",\n]\ndoc_row_lines = 3\n\nmissing_a = {}\nfor path in up_files:\n    b = blob(path)\n    want = Counter(added(BASE, TARGET, path))\n    gap = want - (b or Counter())\n    if gap:\n        missing_a[path] = gap\ntotal_a = sum(sum(c.values()) for c in missing_a.values())\nfor path, counter in missing_a.items():\n    if path not in version_files:\n        fail(f\"unexpected upstream missing lines in {path}: {list(counter)[:3]}\")\n    for text in counter:\n        if \"4.0.25\" not in text:\n            fail(f\"unexpected missing upstream line in {path}: {text[:80]}\")\nif total_a != 4:\n    fail(f\"direction A expected 4 version lines, got {total_a}\")\n\nmissing_b = {}\nfor path in sorted(fork_files):\n    b = blob(path)\n    want = Counter(added(BASE, PRESYNC, path))\n    gap = want - (b or Counter())\n    if gap:\n        missing_b[path] = gap\ntotal_b = sum(sum(c.values()) for c in missing_b.values())\nfor path, counter in missing_b.items():\n    if path in version_files:\n        for text in counter:\n            if \"4.0.24-1\" not in text:\n                fail(f\"unexpected fork missing line in {path}: {text[:80]}\")\n    elif path == \"docs/HOW_TO_REBASE_UPSTREAM.md\":\n        continue\n    else:\n        fail(f\"unexpected fork-side missing file {path}: {list(counter)[:2]}\")\n\nnon_overlap = [f for f in up_files if f not in fork_files]\nfor path in non_overlap:\n    if path in missing_a:\n        fail(f\"non-overlapping upstream file lost lines: {path}\")\n\nrequired_absent = [\n    \"tauri_plugin_updater\",\n    \"updater_builder\",\n    \"@tauri-apps/plugin-updater\",\n]\nfor pat in required_absent:\n    r = subprocess.run(\n        [\"git\", \"grep\", \"-I\", \"-l\", pat, \"HEAD\", \"--\", \"src-tauri\", \"src\", \"package.json\"],\n        capture_output=True,\n        text=True,\n    )\n    if r.stdout.strip():\n        fail(f\"removed chain revived: {pat} -> {r.stdout.splitlines()[:3]}\")\n\nrequired_present = {\n    \"connectivity_test_provider_models\": [\"src-tauri/src/lib.rs\"],\n    \"connectivity_probe_provider\": [\"src-tauri/src/lib.rs\"],\n    \"start_mcp_connectivity_checks\": [\"src-tauri/src/lib.rs\"],\n    \"cancel_mcp_connectivity_checks\": [\"src-tauri/src/lib.rs\"],\n    \"pub fn panel_visible\": [\"src-tauri/src/tray_panel.rs\"],\n    \"set_show_menu_on_left_click(false)\": [\"src-tauri/src/tray.rs\"],\n    \"tray_left_click_never_opens_the_menu\": [\"src-tauri/src/tray.rs\"],\n    \"KIMI_ALLOWED_PRESET_NAMES\": [\"src/components/providers/forms/KimiProviderForm.tsx\"],\n    \"forkOfficialAllowlist\": [\"src/config/forkOfficialAllowlist.ts\"],\n    \"website_url_2\": [\"src-tauri/src/provider.rs\"],\n    \"VisibleSidebarPanels\": [\"src-tauri/src/settings.rs\"],\n    \"CodexQuotaProtection\": [\"src-tauri/src/settings.rs\"],\n    \"rateSource\": [\"src/types.ts\"],\n}\nfor pat, files in required_present.items():\n    hits = sh([\"git\", \"grep\", \"-I\", \"-l\", pat, \"HEAD\", \"--\"] + files)\n    if not hits.strip():\n        fail(f\"fork/upstream semantics missing: {pat}\")\n\nif sh([\"git\", \"grep\", \"-I\", \"-n\", \"stream_check_provider\", \"HEAD\", \"--\", \"src-tauri/src/lib.rs\"], allow_none=True).strip():\n    fail(\"stream_check_provider registered in lib.rs\")\nfor mod_file in [\"src-tauri/src/services/mod.rs\", \"src-tauri/src/commands/mod.rs\"]:\n    body = sh([\"git\", \"show\", f\"HEAD:{mod_file}\"])\n    if re.search(r\"^\\s*(pub )?mod stream_check;\", body, re.M):\n        fail(f\"stream_check module declared in {mod_file}\")\n\nif sh([\"git\", \"grep\", \"-I\", \"-n\", \"farion1231/cc-switch/releases\", \"HEAD\", \"--\", \"src-tauri\"], allow_none=True).strip():\n    fail(\"upstream release URLs present in src-tauri\")\ntunecc = sh([\"git\", \"grep\", \"-I\", \"-c\", \"tunecc/cc-switch/releases\", \"HEAD\", \"--\", \"src-tauri/src/commands/misc.rs\"])\nif not tunecc.strip():\n    fail(\"fork tunecc URLs lost\")\n\nif os.path.exists(\".github/dependabot.yml\"):\n    fail(\"dependabot config not removed with upstream\")\nrelease = sh([\"git\", \"show\", \"HEAD:.github/workflows/release.yml\"])\nif \"macos-15\" in release:\n    fail(\"Release runner moved to macos-15 against the recorded decision\")\nif \"- os: macos-14\" not in release:\n    fail(\"Release macOS matrix missing macos-14\")\n\nimport json as _json\n\n\ndef dup_count(path):\n    dups = []\n\n    def hook(pairs):\n        seen = set()\n        for k, _v in pairs:\n            if k in seen:\n                dups.append(k)\n            seen.add(k)\n        return dict(pairs)\n\n    _json.loads(open(path, encoding=\"utf-8\").read(), object_pairs_hook=hook)\n    return len(dups)\n\n\nfor loc in [\"en\", \"ja\", \"zh\", \"zh-TW\", \"tr\"]:\n    p = f\"src/i18n/locales/{loc}.json\"\n    n = dup_count(p)\n    if n:\n        fail(f\"duplicate keys in {p}: {n}\")\ntr_up = sh([\"git\", \"show\", f\"v4.0.25:src/i18n/locales/tr.json\"])\nif open(\"src/i18n/locales/tr.json\", encoding=\"utf-8\").read() != tr_up:\n    fail(\"tr.json is not byte-identical with the upstream tag\")\nzh = open(\"src/i18n/locales/zh.json\", encoding=\"utf-8\").read()\nif '\"dit\"' in zh or \"checkConnectivity\" not in zh:\n    fail(\"zh.json locale state wrong (dit residue or missing upstream mcp key)\")\nen = open(\"src/i18n/locales/en.json\", encoding=\"utf-8\").read()\nfor key in [\"connectivityTest\", \"devpanel\", \"trayStyleHelp\"]:\n    if key not in en:\n        fail(f\"fork locale segment missing: {key}\")\n\nfor path in version_files:\n    body = sh([\"git\", \"show\", f\"HEAD:{path}\"])\n    if \"4.0.25-1\" not in body:\n        fail(f\"version file not bumped in {path}\")\n\nmarkers = sh([\"git\", \"grep\", \"-I\", \"-l\", \"-e\", \"^<<<<<<< \", \"-e\", \"^>>>>>>> \", \"HEAD\", \"--\", \"src\", \"src-tauri\", \"tests\", \"docs\", \"README.md\"], allow_none=True)\nif markers.strip():\n    fail(f\"conflict markers remain: {markers.splitlines()[:3]}\")\n\nprint(\n    \"CHECK-PASS fidelity A=%d(4 version lines) B=%d version+doc rows=%d non-overlap files=%d all-clean\"\n    % (total_a, total_b, sum(missing_b.get(\"docs/HOW_TO_REBASE_UPSTREAM.md\", Counter()).values()), len(non_overlap))\n)\n"],"cwdRef":".","durationMs":18575,"exitCode":0,"id":"V7","logRef":"native/sdk-checks/eb10a578d93bcdd847ff982a019351978988f1b0a60fe235a4d91cc6a68accb8/logs/checks/0e7d7716c6df45623a13b8d7f54ccc736da4e9adda49b5a3e142a54242c68014-V7.log","logSha256":"6e740f58e2f1ddf0ec38673a817ac73034644edc8447a51e8ccd89e2b73cad28","name":