                if not hits.strip():
                    fail(f"fork/upstream semantics missing: {pat}")

            if sh(["git", "grep", "-I", "-n", "stream_check_provider", "HEAD",
            "--", "src-tauri/src/lib.rs"], allow_none=True).strip():
                fail("stream_check_provider registered in lib.rs")
            for mod_file in ["src-tauri/src/services/mod.rs",
            "src-tauri/src/commands/mod.rs"]:
                body = sh(["git", "show", f"HEAD:{mod_file}"])
