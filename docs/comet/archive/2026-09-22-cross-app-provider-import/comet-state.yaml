    text: 修复第三轮独立验收的唯一失败项 A9（写侧未限制目标）。buildImportedSettingsConfig 原先把 claude 与
      claude-desktop 共用一支，导致向新建的 claude-desktop 供应商导入时也写下
      env.ANTHROPIC_MODEL——弹窗的「本次将写入」清单用的是
      targetSupportsDefaultModel（claude-desktop 为 false），所以这个键从未被预告，用户会在 JSON
      编辑器里看到一个来路不明的值。影响被 ClaudeDesktopProviderForm 提交时按 baseUrl/apiKey 重建 env
      挡在数据库之外，但确实违反 A9「读侧与写侧都受限」。修法：claude-desktop 拆成独立分支，只写 ANTHROPIC_BASE_URL
      与 ANTHROPIC_AUTH_TOKEN；编辑路径本来就有 if (targetAppId === "claude")
      守卫，两条写路径对同一目标的字段集合现在一致。同时补两条测试关闭上一轮「无法验证」项：claude-desktop 两条写路径都不出现
