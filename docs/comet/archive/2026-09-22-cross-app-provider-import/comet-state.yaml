acceptance:
  - id: A1
    source: brief.md
    text: "A1: 新建供应商表单中，来源应用导入按钮出现在预设供应商区域内；按钮只对「已在设置中启用、该应用至少有 1
      个供应商、且不是当前应用」的应用出现。"
    result: passed
    reason:
      text: Add mode passes the button row into the preset region via
        extraActions={importEntry}
        (src/components/providers/forms/ProviderForm.tsx:2305-2316); the slot
        renders inside the region, directly above the preset grid
        (src/components/providers/forms/ProviderPresetSelector.tsx:402); the
        three filter conditions live in
        src/components/providers/forms/hooks/useProviderImportSources.ts:35-41,85-92;
        the whole row is not rendered when there is no source
        (src/components/providers/forms/ProviderImportEntry.tsx:136); the other
        four forms are wired the same way.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 编辑供应商表单中，同一组来源应用导入按钮出现在表单顶部的独立入口行。"
    result: passed
    reason:
      text: Edit mode renders the same button row at the top of the form
        (src/components/providers/forms/ProviderForm.tsx:2318-2322, and the
        other four forms at 935-940 / 495-500 / 240-245 / 1334-1339); add mode
        is gated on !initialData everywhere, so it cannot double-render.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 点击来源应用按钮后弹出该应用的供应商列表，展示名称、备注与请求地址摘要，并展示本次将写入的字段；取消不改变表单任何字段。"
    result: passed
    reason:
      text: The dialog shows name, note (with a placeholder when empty) and the
        request-URL summary (with a placeholder when empty)
        (src/components/providers/forms/ProviderImportEntry.tsx:206-251); the
        'will be written' list only lists fields that actually have a value
        (:91-105); cancelling only clears local state and never calls onImport
        (:277-281,71-79).
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 编辑模式下，弹窗明确提示导入会覆盖当前表单已填写的名称 / 备注 / 官网 / 密钥 / 请求地址。"
    result: passed
    reason:
      text: The isEditMode warning paragraph names all five fields
        (src/components/providers/forms/ProviderImportEntry.tsx:197-204) and
        overwriteWarning exists in all four locales; tests assert it is absent
        in add mode and present in edit mode.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 选中来源供应商并确认后，表单的供应商名称、备注、官网链接、API Key、API
      请求地址、默认模型名被替换为该来源供应商的对应值；`meta.apiFormat`
      在来源取值属于目标应用支持集合时一并替换，否则保持目标应用默认值。"
    result: passed
    reason:
      text: src/components/providers/forms/hooks/useProviderImportApply.ts:70-108
        replaces the identity fields and injects the mapped config; apiFormat is
        applied only when resolveImportedApiFormat returns a value, otherwise
        the target default is left alone (src/utils/providerImport.ts:227-235);
        three end-to-end assertions land on the real submitted payload.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 导入不影响导入范围之外的表单状态：新建模式下预设选中态回到「自定义」；图标、第二个官网链接等保持导入前状态；编辑模式下
      providerKey、模型表、Codex `modelCatalog`、Gemini 顶层 `config`、`env` / `options`
      / `auth` 中的其他键（含 Codex `auth.json` 的登录态键）全部原样存活。"
    result: passed
    reason:
      text: "Edit mode uses in-place patches only: resetOpencodeState /
        resetOpenclawState / resetHermesState are all mode === 'add' gated;
        resetCodexConfig is passed the existing codexCatalogModels;
        resetGeminiConfig is passed the existing top-level config; grokbuild
        never touches profile / upstreamModel; pi keeps models + providerKey. I
        re-ran both write paths for all 10 targets to confirm."
      truncated: false
  - id: A7
    source: brief.md
    text: 'A7: 保存出的供应商 `settingsConfig` 形状与目标应用原生新建一致（claude 写
      `env.ANTHROPIC_BASE_URL` / `env.ANTHROPIC_AUTH_TOKEN`；codex 写
      `auth.OPENAI_API_KEY` 与 TOML `base_url`，`wire_api` 恒为 `"responses"`；gemini
      写 `env.GOOGLE_GEMINI_BASE_URL` / `env.GEMINI_API_KEY`；opencode 写
      `options.baseURL` / `options.apiKey`；openclaw 写 `baseUrl` /
      `apiKey`；hermes 写 `base_url` / `api_key`；pi 写 `baseUrl` / `apiKey`；mcode 写
      `options.baseURL` / `options.apiKey`；grokbuild 写 TOML `base_url` /
      `api_key`）。'
    result: passed
    reason:
      text: All 10 targets' write locations match the spec table item by item
        (src/utils/providerImport.ts:247-353); codex wire_api stays 'responses';
        each app's add shape matches its own custom default.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 来源供应商缺少某项字段（无备注、无官网链接、无 Key、无地址）时，对应表单字段留空，不写入 `undefined`、占位文本或
      `null`。"
    result: passed
    reason:
      text: Missing values become '' and the write side either skips the key
        (claude/claude-desktop/pi) or deletes it (setOrDelete, :358-365) or
        writes an empty string per template; gemini's envObjToString drops empty
        env keys, so GEMINI_MODEL:'' never reaches the DB.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: 默认模型名只在 claude / codex / gemini
      三者间迁移（读侧与写侧都受限，新建与编辑两条写路径对同一目标的字段集合必须一致）；来源或目标没有该字段时目标模型字段留空（Codex 删掉模板自带的
      `model` 行，不填占位模型）。"
    result: passed
    reason:
      text: Both write paths write the model only for claude/codex/gemini;
        claude-desktop has a dedicated branch (:260-265) plus a patch-side if
        (targetAppId === 'claude') guard (:400-402); grokbuild does not write
        upstreamModel (:292-299); the read side returns '' for 7 apps; the
        dialog uses the same predicate
        (src/components/providers/forms/ProviderImportEntry.tsx:103); codex
        deletes the template model line when the source has no model
        (src/utils/providerConfigUtils.ts:1422-1428). Verified by running both
        directions for all 10 targets in an out-of-repo scratch harness.
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: 各来源 × 目标应用组合的读写映射有单元测试覆盖，至少包含
      claude↔codex、claude↔gemini、codex↔claude、opencode↔claude、hermes↔codex
      五组方向，以及全部 10 个应用的读取用例；编辑模式的就地覆盖路径对每个目标应用都有「保留范围外键」的断言。"
    result: passed
    reason:
      text: "Read cases exist for all 10 apps; the five directions are covered
        (claude<->codex, claude<->gemini, codex->claude, opencode->claude,
        hermes->codex); each of the 10 targets has a 'preserves out-of-scope
        keys' assertion. The assertions are non-vacuous: reverting either
        round-4 fix makes them fail."
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: API Key 不出现在弹窗 DOM、console 日志与 toast 中（弹窗只展示地址与名称摘要）。"
    result: passed
    reason:
      text: The dialog renders only name, note, URL summary and field labels; the
        import path emits no toast; the new code has only two console.error
        calls printing API error objects, which contain no provider data.
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: 既有
      `tests/components/ProviderPresetSelector.test.tsx`、`tests/components/AddP\
      roviderDialog.test.tsx`、`tests/components/EditProviderDialog.test.tsx`
      用例不回归。"
    result: passed
    reason:
      text: "I re-ran the full suite: 152 files / 1320 tests pass;
        tests/components/ProviderPresetSelector.test.tsx is purely additive and
        asserts the slot does not pollute the preset list; AddProviderDialog (7)
        and EditProviderDialog (11) pass on their own."
      truncated: false
