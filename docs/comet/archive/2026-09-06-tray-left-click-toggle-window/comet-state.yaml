acceptance:
  - id: A1
    source: brief.md
    text: "A1: 主窗口隐藏时左键单击托盘图标：主窗口显示、置前并聚焦；主窗口已最小化时左键单击：还原、置前并聚焦（而非被隐藏）。"
    result: passed
    reason:
      text: tray.rs toggle_main_window：窗口隐藏时 is_visible=false 走
        show_main_window（unminimize+show+set_focus，Windows
        set_skip_taskbar(false)、macOS apply_tray_policy(true)），与原 show_main
        语义逐行等价；最小化时 is_minimized=true 强制走 show 分支还原而非隐藏，满足'还原、置前并聚焦'。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 应用处于轻量模式（主窗口已销毁）时左键单击托盘图标：退出轻量模式并重建、显示主窗口。"
    result: passed
    reason:
      text: 轻量模式下 get_webview_window("main") 为
        None，toggle_main_window/show_main_window 均走
        lightweight::exit_lightweight_mode（lightweight.rs 从 config 重建
        WebviewWindowBuilder 并
        show+set_focus+set_skip_taskbar(false)/apply_tray_policy(true)+refresh_tray_menu），即退出轻量模式并重建显示。
      truncated: false
  - id: A3
    source: brief.md
    text: 'A3: 主窗口可见（未最小化）时左键单击托盘图标：主窗口隐藏；macOS 上 Dock 图标同步隐藏，Windows
      上任务栏不再显示该窗口（平台处理与"关闭到托盘"一致）。'
    result: passed
    reason:
      text: 窗口可见且未最小化时 hide_main_window 执行 hide → Windows set_skip_taskbar(true) →
        macOS
        apply_tray_policy(false)（set_dock_visibility(false)+ActivationPolicy::Accessory，tray.rs:977-993），与
        lib.rs:424-434 CloseRequested+minimize_to_tray_on_close
        分支逐行等价，平台处理与'关闭到托盘'完全一致。
      truncated: false
  - id: A4
    source: brief.md
    text: 'A4: 连续左键单击按"显示 → 隐藏 → 显示"稳定往返；一次左键单击恰好触发一次切换（macOS/Windows 每次点击产生的按下/抬起两次
      `Click` 事件不造成双重切换）。'
    result: passed
    reason:
      text: toggle 只在 lib.rs on_tray_icon_event 内 Click{Left, Up} 触发：tray-icon-0.21.3
        macOS mouseDown/mouseUp 各发一次 Click{Down}/{Up}、Windows WM_LBUTTONDOWN/UP
        各发一次，Down 不触发故单击恰好一次切换；DoubleClick 事件不进 Click 分支（Windows 双击序列
        Down/Up(toggle)/DBLCLK/Up(toggle) 恰为两次切换，符合两次单击语义）；toggle 基于实时
        is_visible/is_minimized 无状态缓存，往返稳定。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: macOS 与 Windows 上左键单击托盘图标不再弹出托盘菜单。"
    result: passed
    reason:
      text: lib.rs:1099 show_menu_on_left_click(false)；平台源码核对：macOS on_tray_click 仅
        Right 或 menu_on_left_click&&Left 才 performClick，Windows 菜单弹出条件
        WM_RBUTTONDOWN||(menu_on_left_click&&WM_LBUTTONDOWN)，false 时左键两平台均不弹菜单。
      truncated: false
  - id: A6
    source: brief.md
    text: 'A6: 右键单击仍弹出托盘菜单，菜单结构与各菜单项行为与改造前一致；主窗口隐藏时通过菜单"打开主界面"仍可显示窗口。'
    result: passed
    reason:
      text: 右键弹菜单路径未动（macOS rightMouseDown→performClick、Windows
        WM_RBUTTONDOWN→TrackPopupMenu）；create_tray_menu 无
        diff，菜单结构不变；handle_tray_menu_event 仅 show_main 分支改为调用行为逐行等价的
        show_main_window，其余菜单项分支未动；主窗口隐藏时经 show_main→show_main_window 可显示。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 既有行为不回归：托盘悬停/点击的用量刷新（10 秒防抖）照常；macOS Dock Reopen 重新激活显示主窗口的行为不变。"
    result: passed
    reason:
