        spawn 调用与 tray.rs LAST_TRAY_USAGE_REFRESH/10s
        MIN_TRAY_USAGE_REFRESH_INTERVAL 防抖均无 diff；RunEvent::Reopen 改为
        show_main_window，与原内联逻辑语义等价，Reopen 显示行为不变。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: `cargo fmt --check`、`cargo clippy -- -D warnings`、`cargo
      test`（src-tauri）与 `pnpm test:unit`、`pnpm typecheck` 全部通过。"
