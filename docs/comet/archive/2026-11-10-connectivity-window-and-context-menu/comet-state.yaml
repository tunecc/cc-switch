例「does not call updateSortOrder when moving an already-top provider to top」通过，提示逻辑未改","result":"passed"},{"id":"A40","reason":"右键删除与「更多」删除为同一 ProviderMenuItems 渲染分支，deleteDisabledReason 展示代码路径唯一","result":"passed"},{"id":"A41","reason":"「更多」菜单改用共享组件渲染，项与顺序保持原样；既有用例全绿","result":"passed"},{"id":"A42","reason":"右键菜单连通性测试项 onSelect 调用 ProviderList handleTest（与卡片同链路），Radix 菜单点击后自动关闭","result":"passed"}],"attempt":1,"iteration":1,"requestReview":{"reason":"原始请求两项（弹窗过小、右键合并置顶/置底与更多菜单）均已实现且未缩减范围：弹窗加宽+内部滚动，右键菜单为置顶/置底+完整「更多」项复用同一组件；无接口行为变化，未触碰非目标（后端测试逻辑、拖拽排序、更多按钮入口）。","result":"aligned"},"risks":["右键菜单在真机的定位细节（side=right+虚拟触发点）建议真机人工过一眼，单测环境无法验证视觉位置"],"summary":"42/42 验收通过。A1-A6/A24-A25/A37-A42 由本轮实现与新增用例直接覆盖；A7-A23/A26-A36 为本轮零改动的既有链路，由全量 3954/3954 单测与 typecheck 通过证明无回归。","verdict":"pass"}},"verifierExecutionRef":"claude-main-connectivity-window"}}},"proposalHash":"c8b0182c191f058d1c83454b848b6abb2b112a31668cb79eb46fa0051dd9d3c9","choices":["approved","rejected","reverify"],"results":{},"decision":{"id":"c01adb481597dc1b16850e46ba22668f4946b24463d772750c64cf5aed6b485c","choice":"approved","proposalHash":"c8b0182c191f058d1c83454b848b6abb2b112a31668cb79eb46fa0051dd9d3c9","reason":"用户明确接受验收结果（42/42 通过），进入归档"}}],"ready":[],"joins":{},"outputs":{},"children":[],"lineage":[]},"sourceRevision":20,"sourceHash":"8436d17948681134fc00037f2f5e5bd820735033aa3a4224b3b3b5729d61bc43","pool":{"version":3,"values":[{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"connectivity-window-and-context-menu","task":"1. 连通性测试的窗口特别小，看不到内容，要修复。2. 右键点击任何供应商时，把一键置顶、置底与现在右键菜单里'更多'的内容合并，直接展开显示，不再需要先点'更多'。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: 打开连通性测试弹窗（含多个模型行、高级参数展开时），在默认窗口尺寸下弹窗内所有区域（参数区、统计卡、模型表格、免责声明、底部按钮）均可见或可通过弹窗内滚动到达，无内容溢出被截断。"},{"id":"A2","source":"brief.md","text":"A2: 弹窗宽度不小于当前 max-w-2xl，模型表格的列（勾选、模型、状态、首字节、总耗时、错误信息、操作）不再出现因宽度不足被挤压换行到不可读。"},{"id":"A3","source":"brief.md","text":"A3: 右键点击任意供应商卡片，弹出的菜单包含：一键置顶、一键置底，以及原「更多」菜单的全部项（模式相关项、复制、连通性测试、用量配置、删除），无需再点击「更多」按钮。"},{"id":"A4","source":"brief.md","text":"A4: 右键菜单中置顶/置底的排序行为与原小菜单一致（写 sortIndex、刷新列表与托盘菜单、toast 提示、已在顶部/底部时提示不变）。"},{"id":"A5","source":"brief.md","text":"A5: 右键菜单中删除项的禁用原因展示、连通性测试禁用态（isTesting）、模式项的子菜单行为与原「更多」菜单一致；点击任一项后菜单关闭且动作正常执行。"},{"id":"A6","source":"brief.md","text":"A6: 卡片上的「更多」按钮菜单行为不变（原有项与顺序不受影响）。"},{"id":"A7","source":"specs/provider-connectivity-test/spec.md","text":"所有勾选模型测试成功 - **WHEN** 用户对配置了有效端点、鉴权与模型的供应商发起连通性测试并勾选若干模型 - **THEN** 每个勾选模型返回 `success` 状态、首字节时间与总耗时，未勾选模型不发起请求"},{"id":"A8","source":"specs/provider-connectivity-test/spec.md","text":"鉴权失败被识别为错误 - **WHEN** 供应商鉴权凭证无效，上游返回 401/403 - **THEN** 该模型结果为 `error`，错误信息包含 HTTP 状态，且请求详情中包含实际发送的 URL 与请求体"},{"id":"A9","source":"specs/provider-connectivity-test/spec.md","text":"流式响应中的错误事件被识别 - **WHEN** 上游以 200 响应但在 SSE 流中返回错误事件（如 `event: error` 或 `response.failed`）或错误 JSON 载荷 - **THEN** 该模型结果为 `error`，错误信息说明响应包含错误事件"},{"id":"A10","source":"specs/provider-connectivity-test/spec.md","text":"超时判定 - **WHEN** 单个模型的测试在总超时时间内未获得完整响应 - **THEN** 该模型结果为 `error`，错误信息说明超时"},{"id":"A11","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商配置为 OpenAI Chat Completions - **WHEN** 某 Claude 供应商 `meta.apiFormat=openai_chat` 且用户对其模型发起连通性测试 - **THEN** 请求详情中的 URL 为 `{base}/v1/chat/completions`，请求体为 Chat Completions 形状（messages 含测试提示词；流式时含 `stream:true` 与 `stream_options.include_usage`），鉴权头与该供应商真实转发请求一致"},{"id":"A12","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商配置为 OpenAI Responses - **WHEN** 某 Claude 供应商 `meta.apiFormat=openai_responses` - **THEN** 测试请求 URL 为 `{base}/v1/responses`，请求体为 Responses 形状"},{"id":"A13","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商配置为 Gemini Native - **WHEN** 某 Claude 供应商 `meta.apiFormat=gemini_native`，流式开关开启 - **THEN** 测试请求 URL 为 `{base}/v1beta/models/{model}:streamGenerateContent?alt=sse`，请求体为 Gemini generateContent 形状，鉴权为 x-goog-api-key（普通 key）或 Bearer access_token（OAuth 凭据含可用 access_token 时）"},{"id":"A14","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商保持 Anthropic 原生 - **WHEN** 某 Claude 供应商未配置 apiFormat 或配置为 anthropic - **THEN** 测试请求 URL 为 `{base}/v1/messages`，请求体为 Anthropic Messages 形状，请求头含 `anthropic-version: 2023-06-01`"},{"id":"A15","source":"specs/provider-connectivity-test/spec.md","text":"Codex 供应商 wire_api 为 chat - **WHEN** 某 Codex 供应商 TOML `wire_api=\"chat\"`（或 apiFormat 等价声明） - **THEN** 测试请求 URL 为 `{base}/chat/completions`，请求体为 Chat Completions 形状"},{"id":"A16","source":"specs/provider-connectivity-test/spec.md","text":"Codex 供应商 wire_api 为 anthropic - **WHEN** 某 Codex 供应商 TOML `wire_api=\"anthropic\"`（或 apiFormat 等价声明） - **THEN** 测试请求 URL 为 `{base}/v1/messages`，请求体为 Anthropic Messages 形状，鉴权头按 apiKeyField 决定"},{"id":"A17","source":"specs/provider-connectivity-test/spec.md","text":"base_url 为完整端点 URL - **WHEN** 供应商 `meta.isFullUrl=true` 且 base_url 已是完整端点地址 - **THEN** 测试请求 URL 直接使用该 base_url，不追加端点路径"},{"id":"A18","source":"specs/provider-connectivity-test/spec.md","text":"目标构造失败返回错误结果 - **WHEN** 供应商缺少 base_url 或可用鉴权，或请求体转换报错 - **THEN** 对应模型返回 `error` 结果，错误信息说明原因，不产生 panic 或半构造请求"},{"id":"A19","source":"specs/provider-connectivity-test/spec.md","text":"打开弹窗展示全部模型 - **WHEN** 用户打开某可测供应商的连通性测试弹窗 - **THEN** 全部静态清单模型以「待测试」行展示，并按预选逻辑自动勾选一个模型"},{"id":"A20","source":"specs/provider-connectivity-test/spec.md","text":"勾选行发起测试 - **WHEN** 用户勾选若干模型行并点击开始测试 - **THEN** 仅勾选模型进入「测试中」，逐模型返回后逐行更新为终态"},{"id":"A21","source":"specs/provider-connectivity-test/spec.md","text":"失败模型自动勾选 - **WHEN** 一轮测试完成且存在失败模型 - **THEN** 勾选集合自动替换为失败模型，用户可直接再次点击开始测试重测失败项"},{"id":"A22","source":"specs/provider-connectivity-test/spec.md","text":"未勾选时无法开始测试 - **WHEN** 用户未勾选任何模型并点击开始测试 - **THEN** 系统提示需要先选择模型，且不发起任何请求"},{"id":"A23","source":"specs/provider-connectivity-test/spec.md","text":"查看请求详情 - **WHEN** 测试完成后用户点击某模型的\"请求详情\"入口 - **THEN** 弹窗展示该模型的请求 URL、请求 headers（鉴权头脱敏）、请求体、响应 headers 与响应体，内容与实际发送/接收一致"},{"id":"A24","source":"specs/provider-connectivity-test/spec.md","text":"弹窗内容完整可见（验收：A1） - **WHEN** 在常规应用窗口尺寸下打开含多行模型、高级参数展开的连通性测试弹窗 - **THEN** 参数区、统计卡、模型表格、免责声明与底部按钮均可见或可通过弹窗内滚动到达，无内容溢出被截断"},{"id":"A25","source":"specs/provider-connectivity-test/spec.md","text":"模型表格各列可读（验收：A2） - **WHEN** 打开连通性测试弹窗并查看模型表格 - **THEN** 勾选、模型、状态、首字节、总耗时、错误信息、操作各列排布可读，无因宽度不足导致的不可读挤压"},{"id":"A26","source":"specs/provider-connectivity-test/spec.md","text":"追加合并去重 - **WHEN** 静态清单含 claude-x、claude-y，远端返回 claude-x、claude-z - **THEN** 表格展示 claude-x、claude-y、claude-z 三行，均为待测试状态"},{"id":"A27","source":"specs/provider-connectivity-test/spec.md","text":"拉取失败不阻断 - **WHEN** 上游 /v1/models 返回 404 或超时 - **THEN** 弹窗显示对应错误提示，静态清单行保持可用"},{"id":"A28","source":"specs/provider-connectivity-test/spec.md","text":"拉取结果不持久化 - **WHEN** 用户拉取模型并关闭弹窗后重新打开 - **THEN** 表格恢复为静态清单，不含上次拉取的远端模型"},{"id":"A29","source":"specs/provider-connectivity-test/spec.md","text":"重开弹窗恢复已保存参数 - **WHEN** 用户曾修改某供应商的测试 prompt 与默认测试模型并保存，随后重新打开该供应商的测试弹窗 - **THEN** 弹窗显示之前保存的 prompt 与默认测试模型，且默认勾选该默认测试模型"},{"id":"A30","source":"specs/provider-connectivity-test/spec.md","text":"首次打开使用默认值 - **WHEN** 用户首次打开某供应商的测试弹窗且该供应商从未保存过测试参数 - **THEN** 弹窗提示词为 `你好，你可以帮我做什么事情`，无默认测试模型（按预选逻辑勾选），流式开启，发起测试时后端实际发送该默认 prompt"},{"id":"A31","source":"specs/provider-connectivity-test/spec.md","text":"批量探针逐供应商更新徽标 - **WHEN** 用户触发批量连通探针 - **THEN** 各供应商卡片按完成顺序逐个更新为成功/失败徽标与耗时，最多 5 个探针同时进行"},{"id":"A32","source":"specs/provider-connectivity-test/spec.md","text":"无模型的供应商被跳过 - **WHEN** 某供应商未配置任何模型或属于官方供应商 - **THEN** 批量探针不对其发起请求，卡片不显示探针结果徽标"},{"id":"A33","source":"specs/provider-connectivity-test/spec.md","text":"探针目标同样按 API 格式对齐 - **WHEN** 批量探针命中某 apiFormat=openai_chat 的 Claude 供应商 - **THEN** 该探针发出的请求 URL 与请求体按 Chat Completions 形状构造，与该供应商弹窗内测试同源"},{"id":"A34","source":"specs/provider-connectivity-test/spec.md","text":"旧检测入口指向新测试 - **WHEN** 用户在供应商卡片上点击连通性检测按钮 - **THEN** 打开按模型连通性测试弹窗（而非发起 base_url 可达性探测）"},{"id":"A35","source":"specs/provider-connectivity-test/spec.md","text":"旧配置面板被移除 - **WHEN** 用户打开设置/用量页面中的连通检测配置区域 - **THEN** 不再显示超时/重试/降级阈值配置项"},{"id":"A36","source":"specs/provider-connectivity-test/spec.md","text":"测试失败不影响熔断器 - **WHEN** 某供应商的连通性测试失败 - **THEN** 该供应商的故障转移熔断器状态保持不变，不被重置或改变开闭状态"},{"id":"A37","source":"specs/provider-context-menu/spec.md","text":"右键菜单包含全部操作（验收：A3） - **WHEN** 用户右键点击任意供应商卡片 - **THEN** 弹出的菜单同时包含一键置顶、一键置底，以及原「更多」菜单的全部项"},{"id":"A38","source":"specs/provider-context-menu/spec.md","text":"置顶行为（验收：A4） - **WHEN** 用户在右键菜单中对非首位供应商点击一键置顶 - **THEN** 该供应商移动到列表顶部，sortIndex 重写，托盘菜单同步更新，出现成功提示"},{"id":"A39","source":"specs/provider-context-menu/spec.md","text":"已在顶部 - **WHEN** 用户对已是首位的供应商点击一键置顶 - **THEN** 提示「该供应商已在顶部」，顺序不变"},{"id":"A40","source":"specs/provider-context-menu/spec.md","text":"删除禁用原因一致（验收：A5） - **WHEN** 某供应商删除被禁止（有禁用原因）且用户打开右键菜单 - **THEN** 删除项禁用并展示与「更多」菜单相同的禁用原因"},{"id":"A41","source":"specs/provider-context-menu/spec.md","text":"「更多」按钮不受影响（验收：A6） - **WHEN** 用户通过卡片「更多」按钮打开菜单 - **THEN** 菜单项、顺序与行为与本需求变更前一致"},{"id":"A42","source":"specs/provider-context-menu/spec.md","text":"右键点击菜单项执行动作 - **WHEN** 用户在右键菜单中点击连通性测试 - **THEN** 菜单关闭并打开该供应商的连通性测试弹窗"}],"children":null,"formalHash":"bd8dea987a2025a48a96ad64eec7c05b5c28fe9c125bedb109eaa5961d45d4ca","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"0aa3ba97c10895c4e3d79891007f87042a28ba876f83a8b0a86830c9a87a4b27","contractHash":"fadec86558803970a9095948b171c4e682e3aad1c0ebb9d0d4a1b372e15a262e","inputHash":"bd614c5b894af15ea309c645c6c8b7f205461cffb1e7f4eb379fc75875e6bb70","legacyFingerprint":"3af3e205305df6b258f1145125d256da87cbca513cdcededb396daf33e3b6f86","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"02f3cd2e16cd24e38f8408ffcf7920ddf6d7b8e1e376b0802bd26ab61a650dbd","contractHash":"35e28ae9506cf9140859f1f2774cff0ebd0adaea38960a242bd89e23610ec24a","inputHash":"49dc812d21f0ade2c9c627b994f3f444e7dfcf9c677afaaf6f8f2f802ead19e6","legacyFingerprint":"af0d4310502fd0fd8e114e695ca26b4a7eef1a21a59dd43dfb249d2e193ce320","source":"specs/provider-connectivity-test/spec.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"5bdce4c5c213fe351a8fe76febdb6ad259a76f77012afe14e43112df2df0942b","contractHash":"13ba3f07ce934d954b9df1c1f3c62af4816187831237d784f925523680ea9e65","inputHash":"45ccf7b81ed217d4172b0fe9a4df5b03de050cd58534aa9e4827e6e4d426356c","legacyFingerprint":"faf2c44c1a2dfe0bd9f0fa69ec5c74f0ff5b5be3cd4d6d00251436d5416b9d03","source":"specs/provider-context-menu/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"7df503e7a4bdb3dbdaa69537e04ca0e77a9821106f40f4a708fbcfc68f3cd44b","specChanges":[{"capability":"provider-connectivity-test","operation":"modify","source":"specs/provider-connectivity-test/spec.md"},{"capability":"provider-context-menu","operation":"create","source":"specs/provider-context-menu/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: 打开连通性测试弹窗（含多个模型行、高级参数展开时），在默认窗口尺寸下弹窗内所有区域（参数区、统计卡、模型表格、免责声明、底部按钮）均可见或可通过弹窗内滚动到达，无内容溢出被截断。"},{"id":"A2","source":"brief.md","text":"A2: 弹窗宽度不小于当前 max-w-2xl，模型表格的列（勾选、模型、状态、首字节、总耗时、错误信息、操作）不再出现因宽度不足被挤压换行到不可读。"},{"id":"A3","source":"brief.md","text":"A3: 右键点击任意供应商卡片，弹出的菜单包含：一键置顶、一键置底，以及原「更多」菜单的全部项（模式相关项、复制、连通性测试、用量配置、删除），无需再点击「更多」按钮。"},{"id":"A4","source":"brief.md","text":"A4: 右键菜单中置顶/置底的排序行为与原小菜单一致（写 sortIndex、刷新列表与托盘菜单、toast 提示、已在顶部/底部时提示不变）。"},{"id":"A5","source":"brief.md","text":"A5: 右键菜单中删除项的禁用原因展示、连通性测试禁用态（isTesting）、模式项的子菜单行为与原「更多」菜单一致；点击任一项后菜单关闭且动作正常执行。"},{"id":"A6","source":"brief.md","text":"A6: 卡片上的「更多」按钮菜单行为不变（原有项与顺序不受影响）。"},{"id":"A7","source":"specs/provider-connectivity-test/spec.md","text":"所有勾选模型测试成功 - **WHEN** 用户对配置了有效端点、鉴权与模型的供应商发起连通性测试并勾选若干模型 - **THEN** 每个勾选模型返回 `success` 状态、首字节时间与总耗时，未勾选模型不发起请求"},{"id":"A8","source":"specs/provider-connectivity-test/spec.md","text":"鉴权失败被识别为错误 - **WHEN** 供应商鉴权凭证无效，上游返回 401/403 - **THEN** 该模型结果为 `error`，错误信息包含 HTTP 状态，且请求详情中包含实际发送的 URL 与请求体"},{"id":"A9","source":"specs/provider-connectivity-test/spec.md","text":"流式响应中的错误事件被识别 - **WHEN** 上游以 200 响应但在 SSE 流中返回错误事件（如 `event: error` 或 `response.failed`）或错误 JSON 载荷 - **THEN** 该模型结果为 `error`，错误信息说明响应包含错误事件"},{"id":"A10","source":"specs/provider-connectivity-test/spec.md","text":"超时判定 - **WHEN** 单个模型的测试在总超时时间内未获得完整响应 - **THEN** 该模型结果为 `error`，错误信息说明超时"},{"id":"A11","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商配置为 OpenAI Chat Completions - **WHEN** 某 Claude 供应商 `meta.apiFormat=openai_chat` 且用户对其模型发起连通性测试 - **THEN** 请求详情中的 URL 为 `{base}/v1/chat/completions`，请求体为 Chat Completions 形状（messages 含测试提示词；流式时含 `stream:true` 与 `stream_options.include_usage`），鉴权头与该供应商真实转发请求一致"},{"id":"A12","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商配置为 OpenAI Responses - **WHEN** 某 Claude 供应商 `meta.apiFormat=openai_responses` - **THEN** 测试请求 URL 为 `{base}/v1/responses`，请求体为 Responses 形状"},{"id":"A13","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商配置为 Gemini Native - **WHEN** 某 Claude 供应商 `meta.apiFormat=gemini_native`，流式开关开启 - **THEN** 测试请求 URL 为 `{base}/v1beta/models/{model}:streamGenerateContent?alt=sse`，请求体为 Gemini generateContent 形状，鉴权为 x-goog-api-key（普通 key）或 Bearer access_token（OAuth 凭据含可用 access_token 时）"},{"id":"A14","source":"specs/provider-connectivity-test/spec.md","text":"Claude 供应商保持 Anthropic 原生 - **WHEN** 某 Claude 供应商未配置 apiFormat 或配置为 anthropic - **THEN** 测试请求 URL 为 `{base}/v1/messages`，请求体为 Anthropic Messages 形状，请求头含 `anthropic-version: 2023-06-01`"},{"id":"A15","source":"specs/provider-connectivity-test/spec.md","text":"Codex 供应商 wire_api 为 chat - **WHEN** 某 Codex 供应商 TOML `wire_api=\"chat\"`（或 apiFormat 等价声明） - **THEN** 测试请求 URL 为 `{base}/chat/completions`，请求体为 Chat Completions 形状"},{"id":"A16","source":"specs/provider-connectivity-test/spec.md","text":"Codex 供应商 wire_api 为 anthropic - **WHEN** 某 Codex 供应商 TOML `wire_api=\"anthropic\"`（或 apiFormat 等价声明） - **THEN** 测试请求 URL 为 `{base}/v1/messages`，请求体为 Anthropic Messages 形状，鉴权头按 apiKeyField 决定"},{"id":"A17","source":"specs/provider-connectivity-test/spec.md","text":"base_url 为完整端点 URL - **WHEN** 供应商 `meta.isFullUrl=true` 且 base_url 已是完整端点地址 - **THEN** 测试请求 URL 直接使用该 base_url，不追加端点路径"},{"id":"A18","source":"specs/provider-connectivity-test/spec.md","text":"目标构造失败返回错误结果 - **WHEN** 供应商缺少 base_url 或可用鉴权，或请求体转换报错 - **THEN** 对应模型返回 `error` 结果，错误信息说明原因，不产生 panic 或半构造请求"},{"id":"A19","source":"specs/provider-connectivity-test/spec.md","text":"打开弹窗展示全部模型 - **WHEN** 用户打开某可测供应商的连通性测试弹窗 - **THEN** 全部静态清单模型以「待测试」行展示，并按预选逻辑自动勾选一个模型"},{"id":"A20","source":"specs/provider-connectivity-test/spec.md","text":"勾选行发起测试 - **WHEN** 用户勾选若干模型行并点击开始测试 - **THEN** 仅勾选模型进入「测试中」，逐模型返回后逐行更新为终态"},{"id":"A21","source":"specs/provider-connectivity-test/spec.md","text":"失败模型自动勾选 - **WHEN** 一轮测试完成且存在失败模型 - **THEN** 勾选集合自动替换为失败模型，用户可直接再次点击开始测试重测失败项"},{"id":"A22","source":"specs/provider-connectivity-test/spec.md","text":"未勾选时无法开始测试 - **WHEN** 用户未勾选任何模型并点击开始测试 - **THEN** 系统提示需要先选择模型，且不发起任何请求"},{"id":"A23","source":"specs/provider-connectivity-test/spec.md","text":"查看请求详情 - **WHEN** 测试完成后用户点击某模型的\"请求详情\"入口 - **THEN** 弹窗展示该模型的请求 URL、请求 headers（鉴权头脱敏）、请求体、响应 headers 与响应体，内容与实际发送/接收一致"},{"id":"A24","source":"specs/provider-connectivity-test/spec.md","text":"弹窗内容完整可见（验收：A1） - **WHEN** 在常规应用窗口尺寸下打开含多行模型、高级参数展开的连通性测试弹窗 - **THEN** 参数区、统计卡、模型表格、免责声明与底部按钮均可见或可通过弹窗内滚动到达，无内容溢出被截断"},{"id":"A25","source":"specs/provider-connectivity-test/spec.md","text":"模型表格各列可读（验收：A2） - **WHEN** 打开连通性测试弹窗并查看模型表格 - **THEN** 勾选、模型、状态、首字节、总耗时、错误信息、操作各列排布可读，无因宽度不足导致的不可读挤压"},{"id":"A26","source":"specs/provider-connectivity-test/spec.md","text":"追加合并去重 - **WHEN** 静态清单含 claude-x、claude-y，远端返回 claude-x、claude-z - **THEN** 表格展示 claude-x、claude-y、claude-z 三行，均为待测试状态"},{"id":"A27","source":"specs/provider-connectivity-test/spec.md","text":"拉取失败不阻断 - **WHEN** 上游 /v1/models 返回 404 或超时 - **THEN** 弹窗显示对应错误提示，静态清单行保持可用"},{"id":"A28","source":"specs/provider-connectivity-test/spec.md","text":"拉取结果不持久化 - **WHEN** 用户拉取模型并关闭弹窗后重新打开 - **THEN** 表格恢复为静态清单，不含上次拉取的远端模型"},{"id":"A29","source":"specs/provider-connectivity-test/spec.md","text":"重开弹窗恢复已保存参数 - **WHEN** 用户曾修改某供应商的测试 prompt 与默认测试模型并保存，随后重新打开该供应商的测试弹窗 - **THEN** 弹窗显示之前保存的 prompt 与默认测试模型，且默认勾选该默认测试模型"},{"id":"A30","source":"specs/provider-connectivity-test/spec.md","text":"首次打开使用默认值 - **WHEN** 用户首次打开某供应商的测试弹窗且该供应商从未保存过测试参数 - **THEN** 弹窗提示词为 `你好，你可以帮我做什么事情`，无默认测试模型（按预选逻辑勾选），流式开启，发起测试时后端实际发送该默认 prompt"},{"id":"A31","source":"specs/provider-connectivity-test/spec.md","text":"批量探针逐供应商更新徽标 - **WHEN** 用户触发批量连通探针 - **THEN** 各供应商卡片按完成顺序逐个更新为成功/失败徽标与耗时，最多 5 个探针同时进行"},{"id":"A32","source":"specs/provider-connectivity-test/spec.md","text":"无模型的供应商被跳过 - **WHEN** 某供应商未配置任何模型或属于官方供应商 - **THEN** 批量探针不对其发起请求，卡片不显示探针结果徽标"},{"id":"A33","source":"specs/provider-connectivity-test/spec.md","text":"探针目标同样按 API 格式对齐 - **WHEN** 批量探针命中某 apiFormat=openai_chat 的 Claude 供应商 - **THEN** 该探针发出的请求 URL 与请求体按 Chat Completions 形状构造，与该供应商弹窗内测试同源"},{"id":"A34","source":"specs/provider-connectivity-test/spec.md","text":"旧检测入口指向新测试 - **WHEN** 用户在供应商卡片上点击连通性检测按钮 - **THEN** 打开按模型连通性测试弹窗（而非发起 base_url 可达性探测）"},{"id":"A35","source":"specs/provider-connectivity-test/spec.md","text":"旧配置面板被移除 - **WHEN** 用户打开设置/用量页面中的连通检测配置区域 - **THEN** 不再显示超时/重试/降级阈值配置项"},{"id":"A36","source":"specs/provider-connectivity-test/spec.md","text":"测试失败不影响熔断器 - **WHEN** 某供应商的连通性测试失败 - **THEN** 该供应商的故障转移熔断器状态保持不变，不被重置或改变开闭状态"},{"id":"A37","source":"specs/provider-context-menu/spec.md","text":"右键菜单包含全部操作（验收：A3） - **WHEN** 用户右键点击任意供应商卡片 - **THEN** 弹出的菜单同时包含一键置顶、一键置底，以及原「更多」菜单的全部项"},{"id":"A38","source":"specs/provider-context-menu/spec.md","text":"置顶行为（验收：A4） - **WHEN** 用户在右键菜单中对非首位供应商点击一键置顶 - **THEN** 该供应商移动到列表顶部，sortIndex 重写，托盘菜单同步更新，出现成功提示"},{"id":"A39","source":"specs/provider-context-menu/spec.md","text":"已在顶部 - **WHEN** 用户对已是首位的供应商点击一键置顶 - **THEN** 提示「该供应商已在顶部」，顺序不变"},{"id":"A40","source":"specs/provider-context-menu/spec.md","tex