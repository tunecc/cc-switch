":"brief.md","text":"A5: `git grep` 取证与同步前一致：`tauri_plugin_updater`/`updater_builder` 命中 0；`tauri-plugin-updater` 未回到 `Cargo.toml`；`createUpdaterArtifacts` 仍为 `false`；`install_update_and_restart` 仍为空壳；`connectivity_test_provider_models`/`connectivity_probe_provider` 在 `lib.rs` 注册在位；`shouldShowTestEntry` 调用链在位。"},{"id":"A6","source":"brief.md","text":"A6: 上游 Claude 多账号能力在 fork 落地后可用：`commands/claude_account.rs` 与 `services/claude_account/**` 模块注册、授权中心可添加账号、Claude 官方卡「登录方式」下拉绑定账号、切卡即切号、卡片副标题显示账号与套餐、卡片/授权中心显示账号额度、绑号卡「打开终端」显示隔离提示；上游新增测试（`ClaudeOfficialSection`、`ProviderCard.claudeAccount`、`useClaudeAccountQuota`、`claudePlan`）全部通过。"},{"id":"A7","source":"brief.md","text":"A7: 卡片叠加符合合并规则：绑号 Claude 官方卡副标题显示账号行（上游语义）、未绑号卡保留 fork 双官网链接并在有套餐时追加 `· 套餐`；fork 模型徽章与快捷切换入口仍在标题行；「打开终端」为卡片图标按钮（编辑左侧），⋯ 菜单不再含终端项；右键置顶/置底仍可用。"},{"id":"A8","source":"brief.md","text":"A8: 连通检测入口判定按上游 `supportsConnectivityCheck`（官方 / OMO / OMO Slim 隐藏）叠加 fork 的 `shouldShowTestEntry`（仅 claude/codex），fork 现有连通性测试入口行为不变，上游 `providerCapabilities.test.ts` 通过。"},{"id":"A9","source":"brief.md","text":"A9: 预设口径不变：`forkOfficialAllowlist` 未被修改；上游新增 ClinePass / TeamoRouter 在 fork 构建（`IS_FORK_BUILD`）下不可见；Kimi 官方预设名称不变且新模型行可见；本轮无 `category: \"local\"` 新预设；`filterForkPresets` 判定实现不改。"},{"id":"A10","source":"brief.md","text":"A10: 4 个既有 locale JSON（`zh`、`en`、`ja`、`zh-TW`）逐文件可解析且按对象作用域统计无任何同名重复键；上游本轮新增键全部在位且取值与 `v4.0.21` 逐字节一致；上游删除的键不再残留；fork 键段（连通性、导入、快捷切换、侧栏、置顶置底等）与 `provider.connectivityCheck`、`settings.general.trayStyleHelp` 的 fork 文案全部在位；`tr.json` 与 `git show v4.0.21:src/i18n/locales/tr.json` 逐字节一致。"},{"id":"A11","source":"brief.md","text":"A11: `pnpm typecheck` 通过（零 `TS2300`，新增 `ClaudeOfficialSection`/`ClaudeAccountQuotaFooter` 类型无重复声明）。"},{"id":"A12","source":"brief.md","text":"A12: `pnpm test:unit` 通过，含上游本轮新增/改写用例（`ClaudeOfficialSection`、`ProviderCard.claudeAccount`、`CodexFormFields.catalogReorder`、`useClaudeAccountQuota`、`claudePlan`、`teamorouterClaudePresets`、`claudeDesktopProviderPresets`、`ProviderCardActions`、`OpenTerminalDialog`、`AuthCenterGroups`）与 fork 既有用例；时间敏感用例按既有 00:00–00:30 窗口口径处理。"},{"id":"A13","source":"brief.md","text":"A13: `pnpm format:check` 通过；`pnpm build:renderer` 通过。"},{"id":"A14","source":"brief.md","text":"A14: `cargo check` 通过，`Cargo.lock` 的改动只来自 `cc-switch` 版本行 `4.0.21-1`（无新增依赖；updater 相关条目不出现）。"},{"id":"A15","source":"brief.md","text":"A15: `cargo test` 通过（含上游 Claude 多账号、Codex 拖拽、轻量模式、代理、MCP、Kimi/Oh My Pi、Gemini 用例，fork 的托盘左键源码护栏与迁移测试）；如遇环境性失败，按规格固定口径取证并记录，不扩大跳过列表。"},{"id":"A16","source":"brief.md","text":"A16: 落地保真核对通过：对 31 个重叠文件按固定四 ref 归一化行多重集算法（`v4.0.20`、`v4.0.21`、`pre-sync-v421`、最终 `HEAD`）逐文件计算「上游新增行缺失」与「fork 新增行缺失」，结果与逐行归类记录在规格中；计算在本轮全部最终态提交落完之后执行；确有意图取舍时逐行说明理由并带重数，未说明的非零缺失即视为丢语义缺陷。"},{"id":"A17","source":"brief.md","text":"A17: `docs/HOW_TO_REBASE_UPSTREAM.md` 已按本轮结果修订（含 §4.8 与 `ProviderCard.tsx`/`commands/settings.rs`/`settings.rs`/`lib.rs`/`services/mod.rs`/`ProviderForm.tsx`/`ClaudeDesktopProviderForm.tsx`/`App.tsx` 等行新口径）；change 内完整目标规格与全局 `docs/comet/specs/upstream-sync/spec.md` 已更新为同步后完整状态，三处记录的数字与归属互相一致。"},{"id":"A18","source":"brief.md","text":"A18: `.comet/config.yaml` 未被修改（`default_workflow: native`、`workflows`、`artifact_root: docs`、`language: zh-CN`、`clarification_mode: batch`、`max_verify_failures: 5` 全部保持）。"},{"id":"A19","source":"brief.md","text":"A19: 轻量模式持久化（上游）与 fork 托盘左键并存：设置文件新增 `lightweight_mode` 字段；面板样式左键仍切换主窗口、原生菜单样式左键仍交系统菜单，`tray_left_click_never_opens_the_menu` 护栏通过。"},{"id":"A20","source":"brief.md","text":"A20: 上游 18 个 tag 之后的提交未进入历史：`git log --oneline v4.0.21..main` 不含 `144c41b96`、`cd9c72108` 等 tag 后提交；`upstream/main` 的引用未被写入 fork 历史。"}],"children":null,"formalHash":"53263a9e9af7eb1adebb18523241055bdfde87a62737069477541b33539a8720","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2eacc55e5aff5c89bdea2f3fd44b639b9157df1f7cbf4dd067f53677614ee919","contractHash":"ede68d620c3a35b6e07aa03029664426b4ecbb6a867a35ad9402de95e5939f