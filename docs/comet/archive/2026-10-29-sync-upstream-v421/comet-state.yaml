roviderCardActions`、`OpenTerminalDialog`、`AuthCenterGroups`）与 fork 既有用例；时间敏感用例按既有 00:00–00:30 窗口口径处理。"},{"id":"A13","source":"brief.md","text":"A13: `pnpm format:check` 通过；`pnpm build:renderer` 通过。"},{"id":"A14","source":"brief.md","text":"A14: `cargo check` 通过，`Cargo.lock` 的改动只来自 `cc-switch` 版本行 `4.0.21-1`（无新增依赖；updater 相关条目不出现）。"},{"id":"A15","source":"brief.md","text":"A15: `cargo test` 通过（含上游 Claude 多账号、Codex 拖拽、轻量模式、代理、MCP、Kimi/Oh My Pi、Gemini 用例，fork 的托盘左键源码护栏与迁移测试）；如遇环境性失败，按规格固定口径取证并记录，不扩大跳过列表。"},{"id":"A16","source":"brief.md","text":"A16: 落地保真核对通过：对 31 个重叠文件按固定四 ref 归一化行多重集算法（`v4.0.20`、`v4.0.21`、`pre-sync-v421`、最终 `HEAD`）逐文件计算「上游新增行缺失」与「fork 新增行缺失」，结果与逐行归类记录在规格中；计算在本轮全部最终态提交落完之后执行；确有意图取舍时逐行说明理由并带重数，未说明的非零缺失即视为丢语义缺陷。"},{"id":"A17","source":"brief.md","text":"A17: `docs/HOW_TO_REBASE_UPSTREAM.md` 已按本轮结果修订（含 §4.8 与 `ProviderCard.tsx`/`commands/settings.rs`/`settings.rs`/`lib.rs`/`services/mod.rs`/`ProviderForm.tsx`/`ClaudeDesktopProviderForm.tsx`/`App.tsx` 等行新口径）；change 内完整目标规格与全局 `docs/comet/specs/upstream-sync/spec.md` 已更新为同步后完整状态，三处记录的数字与归属互相一致。"},{"id":"A18","source":"brief.md","text":"A18: `.comet/config.yaml` 未被修改（`default_workflow: native`、`workflows`、`artifact_root: docs`、`language: zh-CN`、`clarification_mode: batch`、`max_verify_failures: 5` 全部保持）。"},{"id":"A19","source":"brief.md","text":"A19: 轻量模式持久化（上游）与 fork 托盘左键并存：设置文件新增 `lightweight_mode` 字段；面板样式左键仍切换主窗口、原生菜单样式左键仍交系统菜单，`tray_left_click_never_opens_the_menu` 护栏通过。"},{"id":"A20","source":"brief.md","text":"A20: 上游 18 个 tag 之后的提交未进入历史：`git log --oneline v4.0.21..main` 不含 `144c41b96`、`cd9c72108` 等 tag 后提交；`upstream/main` 的引用未被写入 fork 历史。"}],"children":null,"formalHash":"53263a9e9af7eb1adebb18523241055bdfde87a62737069477541b33539a8720","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"2eacc55e5aff5c89bdea2f3fd44b639b9157df1f7cbf4dd067f53677614ee919","contractHash":"ede68d620c3a35b6e07aa03029664426b4ecbb6a86