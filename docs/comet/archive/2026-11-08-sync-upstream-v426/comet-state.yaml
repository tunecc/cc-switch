pect('\"version\": \"4.0.26-1\"' in open('package.json').read(), 'package.json version')\nexpect('\"version\": \"4.0.26-1\"' in open('src-tauri/tauri.conf.json').read(), 'tauri.conf version')\nexpect('version = \"4.0.26-1\"' in open('src-tauri/Cargo.toml').read(), 'Cargo.toml version')\nexpect('name = \"cc-switch\"\\nversion = \"4.0.26-1\"' in open('src-tauri/Cargo.lock').read(), 'Cargo.lock version')\nexpect('\"@tauri-apps/cli\": \"^2.12.4\"' in open('package.json').read(), 'tauri cli bump')\nexpect('@tauri-apps/plugin-updater' not in open('pnpm-lock.yaml').read(), 'pnpm updater resurrected')\nexpect('tauri-plugin-updater' not in open('src-tauri/Cargo.lock').read(), 'cargo updater resurrected')\n\nfor pat in ['tauri_plugin_updater', 'stream_check_provider', 'cleanup_old_stream_check_logs']:\n    expect(not hits(pat, 'src-tauri'), f'{pat} resurrected')\ns = open('src-tauri/src/commands/settings.rs').read()\nexpect('pub async fn install_update_and_restart(_app: AppHandle) -> Result<bool, String> {\\n    Ok(false)\\n}' in s, 'updater stub changed')\n\nfor pat in ['IS_FORK_BUILD', 'forkOfficialAllowlist', 'forkPresetFilter', 'connectivity_test_provider_models', 'connectivity_probe_provider', 'start_mcp_connectivity_checks', 'cancel_mcp_connectivity_checks', 'website_url_2', 'websiteUrl2', 'VisibleSidebarPanels', 'tray_left_click_never_opens_the_menu', 'ProviderImportEntry', 'useProviderImportSources']:\n    expect(bool(hits(pat, 'src', 'src-tauri')), f'{pat} missing')\nexpect(not hits('farion1231/cc-switch/releases', 'src-tauri'), 'upstream releases URL present')\nrc, out = git('grep', '-I', '-c', 'tunecc/cc-switch/releases', 'HEAD', '--', 'src-tauri/src/commands/misc.rs')\nexpect(rc == 0 and int(out.strip().split(':')[-1]) >= 4, 'tunecc URLs < 4')\n\nb = open('src-tauri/src/database/backup.rs').read()\nexpect('periodic_backup_if_needed' in b and 'cleanup_old_stream_check_logs' not in b, 'backup structure')\nl = open('src-tauri/src/lib.rs').read()\nexpect(l.count('main