s() if l.strip()]\n\nrc, out = git('merge-base', 'HEAD', 'v4.0.26^{}')\nexpect(rc == 0 and out.strip() == 'f621d4216189ef06bcc6acd3588c84937b9794e1', 'merge-base mismatch: ' + out.strip())\nrc, out = git('rev-list', '--count', 'v4.0.25..pre-sync-v426'); pre = int(out.strip())\nrc, out = git('rev-list', '--count', 'v4.0.26..HEAD'); post = int(out.strip())\nexpect(pre == 203, f'pre-sync commits {pre} != 203')\nexpect(post >= pre, f'replayed+new {post} < pre-sync {pre}')\n\nexpect('\"version\": \"4.0.26-1\"' in open('package.json').read(), 'package.json version')\nexpect('\"version\": \"4.0.26-1\"' in open('src-tauri/tauri.conf.json').read(), 'tauri.conf version')\nexpect('version = \"4.0.26-1\"' in open('src-tauri/Cargo.toml').read(), 'Cargo.toml version')\nexpect('name = \"cc-switch\"\\nversion = \"4.0.26-1\"' in open('src-tauri/Cargo.lock').read(), 'Cargo.lock version')\nexpect('\"@tauri-apps/cli\": \"^2.12.4\"' in open('package.json').read(), 'tauri cli bump')\nexpect('@tauri-apps/plugin-updater' not in open('pnpm-lock.yaml').read(), 'pnpm updater resurrected')\nexpect('tauri-plugin-updater' not in open('src-tauri/Cargo.lock').read(), 'cargo updater resurrected')\n\nfor pat in ['tauri_plugin_updater', 'stream_check_provider', 'cleanup_old_stream_check_logs']:\n    expect(not hits(pat, 'src-tauri'), f'{pat} resurrected')\ns = open('src-tauri/src/commands/settings.rs').read()\nexpect('pub async fn install_update_and_restart(_app: AppHandle) -> Result<bool, String> {\\n    Ok(false)\\n}' in s, 'updater stub changed')\n\nfor pat in ['IS_FORK_BUILD', 'forkOfficialAllowlist', 'forkPresetFilter', 'connectivity_test_provider_models', 'connectivity_probe_provider', 'start_mcp_connectivity_checks', 'cancel_mcp_connectivity_checks', 'website_url_2', 'websiteUrl2', 'VisibleSidebarPanels', 'tray_left_click_never_opens_the_menu', 'ProviderImportEntry', 'useProviderImportSources']:\n    expect(bool(hits(pat, 'src', 'src-tauri')), f'{pat} missing')\nexpect(not hits('farion1231/cc-switch/releases', 'src-tauri'), 'upstream releases URL present')\nrc, out = git('grep', '-I', '-c', 'tunecc/cc-switch/releases', 'HEAD', '--', 'src-tauri/src/commands/misc.rs')\nexpect(rc == 0 and int(out.strip().split(':')[-1]) >= 4, 'tunecc URLs < 4')\n\nb = open('src-tauri/src/database/backup.rs').read()\nexpect('periodic_backup_if_needed' in b and 'cleanup_old_stream_check_logs' not in b, 'backup structure')\nl = open('src-tauri/src/lib.rs').read()\nexpect(l.count('main-window-visibility-changed') >= 4, 'visibility emits < 4')\nexpect('MissedTickBehavior::Skip' in l, 'timer behavior')\nm = open('src-tauri/src/database/mod.rs').read()\nexpect('pub(crate) const SCHEMA_VERSION: i32 = 25;' in m, 'schema version != 25')\n\ndef hook(pairs):\n    c = Counter(k for k, _ in pairs)\n    d = [k for k, n in c.items() if n > 1]\n    if d: raise ValueError('dup keys: ' + ','.join(d))\n    return dict(pairs)\nfor loc in ['en', 'ja', 'zh', 'zh-TW', 'tr']:\n    try:\n        json.loads(open(f'src/i18n/locales/{loc}.json').read(), object_pairs_hook=hook)\n    except ValueError as e:\n        fails.append(f'{loc}: {e}')\nrc, tr_tag = git('show', 'v4.0.26:src/i18n/locales/tr.json')\nexpect(rc == 0 and tr_tag == open('src/i18n/locales/tr.json').read(), 'tr.json not byte-identical')\n\nrel = open('.github/workflows/release.yml').read()\nexpect('macos-14' in rel, 'macos-14 missing')\nexpect('stapler' not in rel.lower() and 'appimage' not in rel.lower(), 'trimmed sections resurrected')\n\nif fails:\n    print('FAIL\\n' + '\\n'.join(fails)); sys.exit(1)\nprint(f'OK merge-base=f621d4216 pre={pre} post={post} versions=4.0.26-1 locales dup=0 tr=identical removal=0 fork-presence=13/13')\n"],"cwdRef":".","executable":"python3","id":"sync-evidence","name":"只读取证：基线/版本/移除链路/fork 保留/locale/裁剪版","repeatable":true,"timeoutMs":120000}]}},{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"sync-upstream-v426","task":"继续同步上游更新，保留我们自己的修改。如果我们做的功能上游有增加了，就询问一下，分析一下，看一下保留上游的还是我们自己的更好。本次同步目标：上游已正式发布 tag v4.0.26（2026-11-05 发布，非 draft/prerelease），fork 当前 4.0.25-1 已同步至 v4.0.25。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"同步基线与重放完整性可核对：`git merge-base main v4.0.26^{}` 为 `f621d4216`（fork 提交全部落在 `v4.0.26` 之上），`git rev-list --count v4.0.26..HEAD` 等于同步前 fork 提交（同步前实测 203，以 `pre-sync-v426` 现取为准）中实际重放的数量加本轮新增提交，重放主题序列与 `pre-sync-v426` 一致，被 git 判空丢弃的提交逐个登记原因，patch-id 差异逐条归类为「冲突停车」或「仅上下文位移/被上游同名声明消化」。"},{"id":"A2","source":"brief.md","text":"fork 全部魔改在终态仍然在位且可用：`IS_FORK_BUILD`/`forkBuild`、`forkOfficialAllowlist`、`forkPresetFilter`、`devpanel/`、连通性测试前后端链路与两个命令注册、模型徽章与快捷切换、`websiteUrl2` 全链路、`VisibleSidebarPanels` 与 Sidebar 过滤、托盘左键切换与源码护栏、跨应用导入接线、右键置顶/置底、无更新器与无 `stream_check` 接线，逐项以 `git grep -I` 取证并跑对应测试。"},{"id":"A3","source":"brief.md","text":"两条连通性链路并存终态不变：上游 MCP 检测链（`services/mcp_connectivity.rs`、`commands/mcp.rs`、`useMcpConnectivity.ts`、`UnifiedMcpPanel.tsx`）与 fork 供应商逐模型测试链（`services/connectivity_test/`、两个命令注册、`ConnectivityBadge`/对话框/批量检测）同时在位；本轮上游 `65f6e682a`（401 显示需登录）与 `start_mcp_connectivity_checks` async 化落地；`stream_check_provider` 保持 0 命中。"},{"id":"A4","source":"brief.md","text":"维护链重构终态：启动路径（`database/mod.rs`）不再跑清理/vacuum；`backup.rs` 为上游新结构（`backup_if_needed` 私有 + `periodic_backup_if_needed` 先备份后清理、备份失败也清理）但**不含** `cleanup_old_stream_check_logs` 调用；lib.rs 定时器首 tick 跑启动维护、`spawn_blocking` + `MissedTickBehavior::Skip`；上游新增维护测试中涉及 stream_check 清理行为的断言按 fork 移除态适配，其余维护/备份用例与 fork 既有用例全部通过。"},{"id":"A5","source":"brief.md","text":"窗口可见性与隐藏暂停同 fork 托盘契约共存：lib.rs 4 处 `main-window-visibility-changed` emit 取上游；`windowActivity.ts` 上游重写整文件落地（fork 零语义）与 `tests/lib/windowActivity.test.ts` 通过；fork 托盘左键四分支、`set_show_menu_on_left_click(false)`、`tray_left_click_never_opens_the_menu` 护栏不变；`tray.rs` 的 Credits 文案与 `plan_line` 取上游。"},{"id":"A6","source":"brief.md","text":"ProviderCard 套餐后缀与 fork 副标题链叠加：上游 `quotaPlanKey`/`useQuotaPlan`/`planSuffix` 与 `src/lib/query/accountPlans.ts`、Auth Center 套餐、Copilot Credits 全落地；fork 的副标题优先级链、模型徽章、双官网链接、右键置顶/置底逐行保留；`tests/lib/accountPlans.test.tsx`、`tests/lib/copilotQuota.test.tsx` 与 fork 既有用例通过。"},{"id":"A7","source":"brief.md","text":"deeplink 扩展与 fork 跨应用导入互不干扰：上游 `deeplink/provider.rs` 的 app 白名单扩展、Claude Desktop 直连/映射卡分流、Pi 系单模型节点全部落地，新 `Provider` 字面量补 `website_url_2`；fork 的 `ProviderImportEntry`/`useProviderImportSources`/表单接线不变。"},{"id":"A8","source":"brief.md","text":"App.tsx 懒加载与 fork 门控叠加：上游 `lazy`/`Suspense` 改造落地，fork 的 `VisibleSidebarPanels` 条件渲染与 Sidebar 过滤保持生效，被门控隐藏的面板不因此提前加载或报错。"},{"id":"A9","source":"brief.md","text":"数据库与 schema 结论可复算：终态 `SCHEMA_VERSION` 为 25（fork 值），迁移臂数量与 `pre-sync-v426` 相同；`dao/providers.rs` 上游批量端点读取与跳过未变保存落地且 `website_url_2` 列与行偏移保留；`database/{schema,tests}.rs`、`dao/providers_tests.rs` 全部用例通过。"},{"id":"A10","source":"brief.md","text":"本地化落地且零静默失效：4 个既有 locale 的上游新增键逐字落地、fork 键段保留；`tr.json` 与 `v4.0.26` tag 逐字节一致且不补 fork 键；5 个 locale 按对象作用域显式查重结果为 `dup=0`。"},{"id":"A11","source":"brief.md","text":"后端在 fork 结构下编译通过：上游新增/修改的 `Provider` 结构体字面量（含 `deeplink/provider.rs` 本轮新增处）补齐 fork 的 `website_url_2` 字段后，`cargo check --all-targets` 与 `cargo nextest run` 零失败、无新增未使用告警，且 `cargo fmt --check` 通过。"},{"id":"A12","source":"brief.md","text":"版本与锁文件终态一致：四处版本号均为 `4.0.26-1`；`Cargo.lock` 不出现任何 `tauri-plugin-updater` 条目，`pnpm-lock.yaml` 反映 `@tauri-apps/cli 2.12.4` 而 fork 移除的 `@tauri-apps/plugin-updater` 三段仍不存在，`pnpm install` 与 `cargo check` 均报告锁文件未被改写。"},{"id":"A13","source":"brief.md","text":"CI 裁剪与 fork URL 保留：`.github/workflows/release.yml` 保持 fork 裁剪版（无 Linux bundle、无 stapler 段、macOS runner 仍 `macos-14`）；`git grep -I -n 'farion1231/cc-switch/releases' HEAD -- src-tauri` 仍 0 命中（fork 的 4 处 tunecc URL 与两个测试断言保留）。"},{"id":"A14","source":"brief.md","text":"交付边界与配置保护：Build/Verify 期间不执行任何远端写操作；`.comet/config.yaml` 在 rebase 中途被历史提交改写时按 `git checkout ORIG_HEAD -- .comet/config.yaml` 恢复且终态与同步前一致；取证性 `git fetch upstream` 不带 `--prune-tags`（本轮 Shape 期实测该组合会删光 fork 专属本地 tag，已从 origin 恢复）；终态工作区除 Runtime 自管文件外无未提交改动，`docs/HOW_TO_REBASE_UPSTREAM.md` §4 与 §4.12 反映本轮实测结论。"},{"id":"A15","source":"brief.md","text":"落地保真核对（四 ref 行多重集口径）：在最终态提交之后，用 `v4.0.26` / `main(=pre-sync-v426)` / `HEAD` 与上游基线四个 ref 计算行多重集差集，184 个上游文件与 fork 侧 148 个代码文件全部参与，非重叠的上游文件在 fork 侧缺失为 0，重叠 38 文件的两侧缺失行逐行归因并带重数，归因只允许「刻意取舍（版本行 / fork 专属文案 / 裁剪段 / 移除链路 / 白名单条目）」一类，出现无法归类的缺失行即判定失败。"}],"children":null,"formalHash":"f3bfd96eb67733dd4a4f01895d44104491ec4cc5973beb25cf7b410d86f1652e","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"74907337f32be1e599d046b275c004941090e32443e157a62deb3c74650065b0","contractHash":"18d4e060199f87a16ed932d90996cbb20963bc43454fb7c3bdc1a154d53dfada","inputHash":"de1f1212c9ecbc098d8cba4292dc1f4ed78a0170c140fb6ace4ae77261b775a5","legacyFingerprint":"af0ce6f9a3b951da8fe2f151a9b03cda30abf0c7b0df29d85d942cb3d3005793","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"c14389e4074d2ed67c26e7a63761c896a3f0d85395a8439ebe7f2f4f63891709","contractHash":"b510a58ca7abeea7bec89062f7266c5a1e990d18820996d7e5bc3b2b2ae271d1","inputHash":"2333796b059c59c9b70d9f43b7723cdf82d65c0edf52b74ca10ee04eaa033cb7","legacyFingerprint":"a5da93b2be12c6a4961c26048d19159fd02a09bb87c18ae6207941f0dc546a79","source":"specs/upstream-sync/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"8b44d2c435ade71e75480b94790a386e95b38b04b07bec8eeac02e375e75dac9","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}}}},{"sequence":1,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"同步基线与重放完整性可核对：`git merge-base main v4.0.26^{}` 为 `f621d4216`（fork 提交全部落在 `v4.0.26` 之上），`git rev-list --count v4.0.26..HEAD` 等于同步前 fork 提交（同步前实测 203，以 `pre-sync-v426` 现取为准）中实际重放的数量加本轮新增提交，重放主题序列与 `pre-sync-v426` 一致，被 git 判空丢弃的提交逐个登记原因，patch-id 差异逐条归类为「冲突停车」或「仅上下文位移/被上游同名声明消化」。"},{"id":"A2","source":