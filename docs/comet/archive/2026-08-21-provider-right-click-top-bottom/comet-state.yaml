  summary:
    text: 实现供应商右键菜单（一键置顶/置底）与新增供应商默认插入第二位。右键菜单内联在 ProviderList.tsx：onContextMenu
      记录位置并打开 fixed 定位菜单，两项分别
      moveProviderToTopQuick/moveProviderToBottomQuick（splice+unshift/push 后
      applyQuickSort 按 index 重写全部 sortIndex），复用现有 providersApi.updateSortOrder
      落库，随后 invalidate [providers]（路由类应用额外 invalidate [failoverQueue]）并
      updateTrayMenu；已在顶/底时 toast.info 且不操作；点击外部/滚动/缩放/Esc 关闭菜单。新增插入第二位放在
      useAddProviderMutation 的 newProvider.sortIndex===undefined 分支：取现有显示顺序，第 0
      项保持 sortIndex=0、其余 +1 让位，新项 sortIndex=1，同时让所有现有项 sortIndex 显式化（解决
      defined-first 排序陷阱）；空列表不触发让位；显式传 sortIndex 的路径（复制）不受影响。补齐 zh/en/zh-TW/ja
      四语言 quickMove* 文案。不新增后端命令，不改拖拽排序与 hover 行内按钮。
    truncated: false
