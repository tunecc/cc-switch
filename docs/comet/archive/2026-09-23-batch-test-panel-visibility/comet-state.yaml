acceptance:
  - id: A1
    source: brief.md
    text: A1 设置开关：设置页「侧边面板」开关组出现「批量检测」，与其余开关同一交互；点按后写入
      `visibleSidebarPanels.batchTest` 并切换高亮状态。
    result: passed
    reason:
      text: AppVisibilitySettings 有
        SidebarPanelButton：active={visibleSidebarPanels.batchTest}，onClick 调
        handleSidebarToggle("batchTest") 翻转该字段并 onChange 写入，variant 随 active 在
        default 与 ghost 之间切换。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 默认显示：未配置 `visibleSidebarPanels`，或已保存数据缺少 `batchTest` 字段时，claude/codex
      供应商视图顶栏的批量检测按钮仍显示。
    result: passed
    reason:
      text: DEFAULT_VISIBLE_SIDEBAR_PANELS.batchTest 为 true；App 用默认值与 settings
        合并，缺字段仍为 true。后端 batch_test 使用 serde default_true 且 Default 为
        true。claude/codex 时 shouldShowTestEntry 为 true，顶栏按钮仍显示。
      truncated: false
  - id: A3
    source: brief.md
    text: A3 隐藏入口：`batchTest` 为 false 时，顶栏批量检测按钮不渲染；其余面板按钮不受影响；`batchTest` 为 true
      且应用支持测试时按钮显示。
    result: passed
    reason:
      text: 非 hermes/openclaw 分支按钮条件为 showBatchTestEntry（shouldShowTestEntry 且
        batchTest）；skills/sessions/mcp/prompts 各自看自身开关。false 不渲染，true 且支持时显示。
      truncated: false
  - id: A4
    source: brief.md
    text: A4 隐藏即停止：批量探测正在进行时把 `batchTest` 设为 false，正在进行的探测停止。
    result: passed
    reason:
      text: useEffect 在入口隐藏且探测进行中时调用 stopProbe。stopProbe 推进代次并丢弃
        waiting/running，只保留已完成项。
      truncated: false
  - id: A5
    source: brief.md
    text: A5 能力守卫仍在：gemini 等不支持批量测试的应用，无论 `batchTest` 取何值，顶栏都不出现批量检测按钮。
    result: passed
    reason:
      text: shouldShowTestEntry 仅对 claude/codex 返回 true。其余应用 showBatchTestEntry 为
        false，顶栏按钮不出现。ProviderCard 未引用 batchTest。
      truncated: false
