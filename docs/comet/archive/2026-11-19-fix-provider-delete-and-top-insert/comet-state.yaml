    text: 两项需求都已实现并提交候选 dcff840bf。①右键删除无效根因修复：ProviderList 的 useEffect 在 window 上裸监听
      pointerdown 关闭右键菜单，点菜单项的 pointerdown 会先把菜单同步卸载，Radix MenuItem 的 onSelect 随
      DOM 丢失（onOpenChange(false) 均未触发即消失）——表现为点删除无反应。删除该 window pointerdown
      分支，点外部/Escape 由 Radix DismissableLayer 的 onOpenChange(false)
      兜底（原「点外部关闭」语义不变），resize/scroll/Escape 窗口级兜底保留；新增两个回归用例（完整 pointer 序列下
      onDelete 必须被调 + 非 current 卡删除项可用），既有「outside pointerdown 关菜单」用例改为对
      document.body 派发以匹配 Radix 的 document 级 dismiss listener（原对 window 派发依赖被删掉的
      window listener，已与真实浏览器传播路径不符）。②新增供应商默认插入顶部：useAddProviderMutation 让位逻辑从「第
      0 项保持 0、其余 +1、新项 sortIndex=1」改为「所有现有项 +1、新项 sortIndex=0」，显式 sortIndex
      路径（复制供应商）语义不变；4 个插入位置用例全部更新为顶部语义。验证：typecheck、format:check、全量 test:unit
      332 文件/4377 用例（新增 2 个）全绿。
