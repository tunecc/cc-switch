化与迁移、上游新增测试全部通过；omp 不进代理适配器与 deeplink。"},{"id":"A18","source":"brief.md","text":"A18: Q1 的 omp 预设白名单生效：`forkOfficialAllowlist.omp` 严格等于 `[\"Ollama\", \"LM Studio\", \"vLLM\"]`；omp 表单的预设目录按名称过滤，目录预设 id 仍为原始数组下标（过滤在编号之后）；未列入白名单的赞助商/聚合站/`Ollama Cloud`/`Meta Model API` 等在 fork 构建的所有 omp 入口不可见；其他 app 的白名单不变。"},{"id":"A19","source":"brief.md","text":"A19: Q2 的跨应用导入口径生效：omp 的纳入/排除与完整目标规格一致（若为来源：`readImportableProviderFields(\"omp\", …)` 读出顶层 `baseUrl`/`apiKey`，身份字段照常复制，`defaultModel` 为空；若为目标：`PiProviderForm` 以 `appId=\"omp\"` 渲染导入入口，`buildImportedSettingsConfig`/`patchImportedSettingsConfig` 产出与 Pi 同形状的配置）；其余应用的导入行为不变。"},{"id":"A20","source":"brief.md","text":"A20: Q3 的 omp 卡片模型口径生效：omp 不进入 fork 的 `MODEL_CAPABLE_APPS`/模型徽章/快捷切换弹窗，卡片维持上游 Pi 家族的当前状态与表单模型表；4 个既有 app 的徽章与快捷切换行为不变。"},{"id":"A21","source":"brief.md","text":"A21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Omp => \"Oh My Pi\"` 标签与上游文案/字段删改。"},{"id":"A22","source":"brief.md","text":"A22: 上游应用排序与 fork 侧栏面板可见性并存：`settings.appOrder` 可往返序列化（camelCase），应用页拖拽后侧栏顺序跟随；`VisibleSidebarPanels` 仍能隐藏 MCP/Skills/会话/Prompts 全局项；两者同时生效时先按 `orderAppIds(settings?.appOrder)` 排序再按 `visibleApps` 过滤，全局项按 `visibleSidebarPanels` 过滤。"},{"id":"A23","source":"brief.md","text":"A23: 上游本轮其余改动在 fork 落地后可用：应用页已安装/未安装分组与拖拽、Pi/omp 折叠高级选项与拉取模型弹窗、Kimi 官方账号模型编辑与无套餐提示、托管 ChatGPT 浏览器登录（`prost` 依赖）、agy 原生用量模型、Claude Copilot 自动协议路由提示（适配到 fork 的 `EndpointField.rightSlot` 布局）、Linux 窗口拖动/缩放、用量 tab 计数与 DeepSeek 空余额语义、托盘额度文案、土耳其语、预设模型刷新与 EveryAPI 移除、`src/whats-new/4.0.20.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"},{"id":"A25","source":"brief.md","text":"A25: schema 24 升级路径正确：模拟上游 v23 形状（有 `enabled_omp`、无 `enabled_kimi`）→ 24 后两表有 `enabled_kimi` 且 `mcp_servers` 保留 `enabled_omp`；模拟 fork v23 形状（有 `enabled_kimi`、无 `enabled_omp`）→ 24 后 `mcp_servers` 有 `enabled_omp`、`skills` 仍无 `enabled_omp`；重复调用幂等；既有 v21/v22 幂等用例保持通过。"}],"children":null,"formalHash":"b34ad12531efe59343964ddd5cee5c5f7933b0a7c6d00018fcd78e6786b8a4b4","shapeConfirmationHash":"0a4c2472b2f4f5e4059faa3417d91b94c52a7617ce4e8c7bd90b3157cba8e181","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}},{"sequence":3,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: rebase 后 `git merge-base main v4.0.20` 等于 `85ad4969`（tag `v4.0.20` 剥离出的提交），`git log v4.0.20..main` 只包含 fork 提交（作者 `Tune`），不含任何上游提交。"},{"id":"A2","source":"brief.md","text":"A2: 重放前 `git rev-list --count v4.0.19..pre-sync-v420` == 182；重放后 `git rev-list --count v4.0.20..HEAD` 与之的差异只来自「被 git 判定为空而丢弃」或「本轮新增提交」，逐条记录；`git log --format='%s' --reverse` 主题序列逐行 diff 为 0 行；patch-id 对照走 stdin（`git show <c> | git patch-id --stable`），不同的提交逐个归类为「仅 hunk 位移」或「冲突停车」，冲突停车逐条记录归属与解法。"},{"id":"A3","source":"brief.md","text":"A3: 51 个重叠文件的冲突解决符合 `docs/HOW_TO_REBASE_UPSTREAM.md` §3 与完整目标规格的逐文件叠加要求：两侧语义并存、除 `README.md` 外无整文件取一侧（高危面为 `database/schema.rs`、`database/tests.rs`、`lib.rs`、`commands/misc.rs`、`settings.rs`、`tray.rs`、`services/provider/{mod,live,pi}.rs`、`PiProviderForm.tsx`、`KimiProviderForm.tsx`、`ClaudeFormFields.tsx`、`ProviderList.tsx`、`App.tsx`、`appConfig.tsx`、`Sidebar.tsx`、4 个 locale、4 个版本与锁文件）。"},{"id":"A4","source":"brief.md","text":"A4: `package.json`、`src-tauri/tauri.conf.json`、`src-tauri/Cargo.toml`、`src-tauri/Cargo.lock` 的版本号均为 `4.0.20-1`；`src-tauri/src/database/mod.rs` 的 `SCHEMA_VERSION` == 24；迁移链：v18→v19（fork `website_url_2` + 上游 mcode 并存）、v19→v20（上游 pi）、v20→v21（fork 修复 mcode/pi + 上游 `enabled_agy`）、v21→v22（fork 幂等补 `enabled_agy` + 上游 `enabled_kimi` 合并）、v22→v23（fork 幂等补 `enabled_kimi` + 上游 `enabled_omp` 合并）、v23→v24