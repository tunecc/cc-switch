21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Omp => \"Oh My Pi\"` 标签与上游文案/字段删改。"},{"id":"A22","source":"brief.md","text":"A22: 上游应用排序与 fork 侧栏面板可见性并存：`settings.appOrder` 可往返序列化（camelCase），应用页拖拽后侧栏顺序跟随；`VisibleSidebarPanels` 仍能隐藏 MCP/Skills/会话/Prompts 全局项；两者同时生效时先按 `orderAppIds(settings?.appOrder)` 排序再按 `visibleApps` 过滤，全局项按 `visibleSidebarPanels` 过滤。"},{"id":"A23","source":"brief.md","text":"A23: 上游本轮其余改动在 fork 落地后可用：应用页已安装/未安装分组与拖拽、Pi/omp 折叠高级选项与拉取模型弹窗、Kimi 官方账号模型编辑与无套餐提示、托管 ChatGPT 浏览器登录（`prost` 依赖）、agy 原生用量模型、Claude Copilot 自动协议路由提示（适配到 fork 的 `EndpointField.rightSlot` 布局）、Linux 窗口拖动/缩放、用量 tab 计数与 DeepSeek 空余额语义、托盘额度文案、土耳其语、预设模型刷新与 EveryAPI 移除、`src/whats-new/4.0.20.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"},{"id":"A25","source":"brief.md","text":"A25: schema 24 升级路径正确：模拟上游 v23 形状（有 `enabled_omp`、无 `enabled_kimi`）→ 24 后两表有 `enabled_kimi` 且 `mcp_servers` 保留 `enabled_omp`；模拟 fork v23 形状（有 `enabled_kimi`、无 `enabled_omp`）→ 24 后 `mcp_servers` 有 `enabled_omp`、`skills` 仍无 `enabled_omp`；重复调用幂等；既有 v21/v22 幂等用例保持通过。"}],"children":null,"formalHash":"b34ad12531efe59343964ddd5cee5c5f7933b0a7c6d00018fcd78e6786b8a4b4","shapeConfirmationHash":"0a4c2472b2f4f5e4059faa3417d91b94c52a7617ce4e8c7bd90b3157cba8e181","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}},{"sequence":18,"value":{"archiveRef":"2026-10-25-sync-upstream-v420","change":"sync-upstream-v420","reportSha256":"66e78ad57b23ebe3951d4acb2b42446b56afe5a7fb639b7dbecd0f012a473d34","runId":"sync-upstream-v420","specs":[{"capability":