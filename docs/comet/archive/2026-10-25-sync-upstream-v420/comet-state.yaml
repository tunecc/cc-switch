`、`zh-TW`）逐文件可解析且按对象作用域统计无任何同名重复键，fork 键段按 key 逐个比对全部在位；上游本轮新增键在 4 个 locale 全部在位且取值与 `v4.0.20` 逐字节一致；上游删除的键不再残留（fork 无引用）；fork 专属覆盖 `provider.connectivityCheck` 与 `settings.general.trayStyleHelp` 保持 fork 文案；`tr.json` 与 `git show v4.0.20:src/i18n/locales/tr.json` 逐字节一致。"},{"id":"A16","source":"brief.md","text":"A16: `tauri_plugin_updater`/`updater_builder` 在全仓 `src-tauri` 命中数仍为 0；`tauri-plugin-updater` 未回到 `src-tauri/Cargo.toml` 依赖表；`createUpdaterArtifacts` 仍为 `false`；`install_update_and_restart` 仍为空壳。"},{"id":"A17","source":"brief.md","text":"A17: 上游 omp 能力在 fork 落地后可用：13 个 `APP_IDS` 含 omp、Apps 页可安装/打开 Oh My Pi（Unix/Windows 安装脚本、`omp upgrade`）、omp 表单可用（复用 Pi 表单、providerKey 查重、模型表/拉取模型弹窗、折叠高级选项）、omp 会话/用量/prompts 与 MCP/Skills omp 开关、`enabled_omp` 持久化与迁移、上游新增测试全部通过；omp 不进代理适配器与 deeplink。"},{"id":"A18","source":"brief.md","text":"A18: Q1 的 omp 预设白名单生效：`forkOfficialAllowlist.omp` 严格等于 `[\"Ollama\", \"LM Studio\", \"vLLM\"]`；omp 表单的预设目录按名称过滤，目录预设 id 仍为原始数组下标（过滤在编号之后）；未列入白名单的赞助商/聚合站/`Ollama Cloud`/`Meta Model API` 等在 fork 构建的所有 omp 入口不可见；其他 app 的白名单不变。"},{"id":"A19","source":"brief.md","text":"A19: Q2 的跨应用导入口径生效：omp 的纳入/排除与完整目标规格一致（若为来源：`readImportableProviderFields(\"omp\", …)` 读出顶层 `baseUrl`/`apiKey`，身份字段照常复制，`defaultModel` 为空；若为目标：`PiProviderForm` 以 `appId=\"omp\"` 渲染导入入口，`buildImportedSettingsConfig`/`patchImportedSettingsConfig` 产出与 Pi 同形状的配置）；其余应用的导入行为不变。"},{"id":"A20","source":"brief.md","text":"A20: Q3 的 omp 卡片模型口径生效：omp 不进入 fork 的 `MODEL_CAPABLE_APPS`/模型徽章/快捷切换弹窗，卡片维持上游 Pi 家族的当前状态与表单模型表；4 个既有 app 的徽章与快捷切换行为不变。"},{"id":"A21","source":"brief.md","text":"A21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Omp => \"Oh My Pi\"` 标签与上游文案/字段删改。"},{"id":"A22","source":"brief.md"