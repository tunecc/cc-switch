sync-upstream-v420:9":{"results":{},"sequence":9}},"waits":[{"id":"sync-upstream-v420:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"sync-upstream-v420"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: rebase 后 `git merge-base main v4.0.20` 等于 `85ad4969`（tag `v4.0.20` 剥离出的提交），`git log v4.0.20..main` 只包含 fork 提交（作者 `Tune`），不含任何上游提交。"},{"id":"A2","source":"brief.md","text":"A2: 重放前 `git rev-list --count v4.0.19..pre-sync-v420` == 182；重放后 `git rev-list --count v4.0.20..HEAD` 与之的差异只来自「被 git 判定为空而丢弃」或「本轮新增提交」，逐条记录；`git log --format='%s' --reverse` 主题序列逐行 diff 为 0 行；patch-id 对照走 stdin（`git show <c> | git patch-id --stable`），不同的提交逐个归类为「仅 hunk 位移」或「冲突停车」，冲突停车逐条记录归属与解法。"},{"id":"A3","source":"brief.md","text":"A3: 51 个重叠文件的冲突解决符合 `docs/HOW_TO_REBASE_UPSTREAM.md` §3 与完整目标规格的逐文件叠加要求：两侧语义并存、除 `README.md` 外无整文件取一侧（高危面为 `database/schema.rs`、`database/tests.rs`、`lib.rs`、`commands/misc.rs`、`settings.rs`、`tray.rs`、`services/provider/{mod,live,pi}.rs`、`PiProviderForm.tsx`、`KimiProviderForm.tsx`、`ClaudeFormFields.tsx`、`ProviderList.tsx`、`App.tsx`、`appConfig.tsx`、`Sidebar.tsx`、4 个 locale、4 个版本与锁文件）。"},{"id":"A4","source":"brief.md","text":"A4: `package.json`、`src-tauri/tauri.conf.json`、`src-tauri/Cargo.toml`、`src-tauri/Cargo.lock` 的版本号均为 `4.0.20-1`；`src-tauri/src/database/mod.rs` 的 `SCHEMA_VERSION` == 24；迁移链：v18→v19（fork `website_url_2` + 上游 mcode 并存）、v19→v20（上游 pi）、v20→v21（fork 修复 mcode/pi + 上游 `enabled_agy`）、v21→v22（fork 幂等补 `enabled_agy` + 上游 `enabled_kimi` 合并）、v22→v23（fork 幂等补 `enabled_kimi` + 上游 `enabled_omp` 合并）、v23→v24（幂等补 `enabled_kimi`（两表）与 `enabled_omp`（仅 `mcp_servers`））全部在位；`create_tables` 的 `mcp_servers` 含 `enabled_agy`/`enabled_kimi`/`enabled_omp`，`skills` 含 `enabled_agy`/`enabled_kimi` 且不含 `enabled_omp`；上游迁移测试改用 `SCHEMA_VERSION` 常量，新增 v23→v24 两侧形状与幂等用例。"},{"id":"A5","source":"brief.md","text":"A5: 完整目标规格「fork 魔改保留清单」每一项在同步后仍然存在且可用：产品名 CC Switch 与 DevPanel、侧边面板可见性、模型徽章与快捷切换（claude/codex/gemini/grokbuild）、Claude 兜底模型直达区与 1M 全选、右键置顶/置底与新建插入第二位、官方预设过滤（含 Q1 的 `omp` 条目）、逐模型连通性测试（`lib.rs` 两个命令注册在位，且 omp 维持上游的测试入口关闭）、双官网链接、跨应用导入（含 Q2 的 omp 口径）、禁用应用内更新器、README fork 说明、fork CI。"},{"id":"A6","source":"brief.md","text":"A6: rebase 后 `.comet/config.yaml` 仍为 fork 当前配置（`default_workflow: native`，`workflows` 含 native 与 classic），fork 专属白名单文件未被上游或重放改写。"},{"id":"A7","source":"brief.md","text":"A7: `docs/HOW_TO_REBASE_UPSTREAM.md` 已按本轮同步结果修订（含 §4.7、`database/schema.rs`/`settings.rs`/`tray.rs`/`PiProviderForm.tsx`/`KimiProviderForm.tsx`/`ProviderList.tsx`/`App.tsx` 等行的新口径与 omp 白名单登记），全局与 change 内完整目标规格已重写为同步后的完整状态（含重放映射、冲突清单、落地保真核对与逐行归类），三处记录的数字与归属互相一致。"},{"id":"A8","source":"brief.md","text":"A8: `pnpm typecheck` 通过（零 `TS2300`，AppId/`VisibleApps`/`forkOfficialAllowlist`/`APP_ICON_MAP` 的 omp 字段无重复声明）。"},{"id":"A9","source":"brief.md","text":"A9: `pnpm test:unit` 通过，含上游本轮新增/改写用例（`ompProviderPresets`、`PiProviderForm`、`AppsPage`、`KimiProviderForm`、`ClaudeFormFields`、`ProviderList`、`AddProviderDialog`、`EditProviderDialog`、`ProviderPresetSelector`、`ClaudeDesktopProviderForm`、`ProviderForm.presetRows.golden`）与 fork 既有用例；时间敏感用例按既有 00:00–00:30 窗口口径处理。"},{"id":"A10","source":"brief.md","text":"A10: `pnpm format:check` 通过（手工拼接共享文件后必须本地 prettier 归一化）。"},{"id":"A11","source":"brief.md","text":"A11: `pnpm build:renderer` 通过。"},{"id":"A12","source":"brief.md","text":"A12: `cargo check` 通过，并确认 `Cargo.lock` 的改动只来自 `cc-switch` 版本行 `4.0.20-1` 与上游新增的 `prost` 依赖树；`tauri-plugin-updater` 相关条目不得出现。"},{"id":"A13","source":"brief.md","text":"A13: `cargo test` 通过（含 fork 的托盘左键源码护栏、上游 omp/Kimi/AGY/托管登录/代理/用量用例、`database/tests.rs` 的 v22→v23 用例在 24 终态下仍成立）；如遇环境性失败，按规格固定口径取证并记录，不扩大跳过列表。"},{"id":"A14","source":"brief.md","text":"A14: 落地保真核对通过：对 51 个重叠文件按固定四 ref 归一化行多重集算法（`v4.0.19`、`v4.0.20`、`pre-sync-v420`、最终 `HEAD`）逐文件计算「上游新增行缺失」与「fork 新增行缺失」，结果与逐行归类记录在规格中；计算在本轮全部最终态提交落完之后执行；确有意图取舍时逐行说明理由并带重数（`README.md` 的整文件 fork 版本、`4.0.20-1` 版本号行属已知取舍），未说明的非零缺失即视为丢语义缺陷。"},{"id":"A15","source":"brief.md","text":"A15: 4 个既有 locale JSON（`zh`、`en`、`ja`、`zh-TW`）逐文件可解析且按对象作用域统计无任何同名重复键，fork 键段按 key 逐个比对全部在位；上游本轮新增键在 4 个 locale 全部在位且取值与 `v4.0.20` 逐字节一致；上游删除的键不再残留（fork 无引用）；fork 专属覆盖 `provider.connectivityCheck` 与 `settings.general.trayStyleHelp` 保持 fork 文案；`tr.json` 与 `git show v4.0.20:src/i18n/locales/tr.json` 逐字节一致。"},{"id":"A16","source":"brief.md","text":"A16: `tauri_plugin_updater`/`updater_builder` 在全仓 `src-tauri` 命中数仍为 0；`tauri-plugin-updater` 未回到 `src-tauri/Cargo.toml` 依赖表；`createUpdaterArtifacts` 仍为 `false`；`install_update_and_restart` 仍为空壳。"},{"id":"A17","source":"brief.md","text":"A17: 上游 omp 能力在 fork 落地后可用：13 个 `APP_IDS` 含 omp、Apps 页可安装/打开 Oh My Pi（Unix/Windows 安装脚本、`omp upgrade`）、omp 表单可用（复用 Pi 表单、providerKey 查重、模型表/拉取模型弹窗、折叠高级选项）、omp 会话/用量/prompts 与 MCP/Skills omp 开关、`enabled_omp` 持久化与迁移、上游新增测试全部通过；omp 不进代理适配器与 deeplink。"},{"id":"A18","source":"brief.md","text":"A18: Q1 的 omp 预设白名单生效：`forkOfficialAllowlist.omp` 严格等于 `[\"Ollama\", \"LM Studio\", \"vLLM\"]`；omp 表单的预设目录按名称过滤，目录预设 id 仍为原始数组下标（过滤在编号之后）；未列入白名单的赞助商/聚合站/`Ollama Cloud`/`Meta Model API` 等在 fork 构建的所有 omp 入口不可见；其他 app 的白名单不变。"},{"id":"A19","source":"brief.md","text":"A19: Q2 的跨应用导入口径生效：omp 的纳入/排除与完整目标规格一致（若为来源：`readImportableProviderFields(\"omp\", …)` 读出顶层 `baseUrl`/`apiKey`，身份字段照常复制，`defaultModel` 为空；若为目标：`PiProviderForm` 以 `appId=\"omp\"` 渲染导入入口，`buildImportedSettingsConfig`/`patchImportedSettingsConfig` 产出与 Pi 同形状的配置）；其余应用的导入行为不变。"},{"id":"A20","source":"brief.md","text":"A20: Q3 的 omp 卡片模型口径生效：omp 不进入 fork 的 `MODEL_CAPABLE_APPS`/模型徽章/快捷切换弹窗，卡片维持上游 Pi 家族的当前状态与表单模型表；4 个既有 app 的徽章与快捷切换行为不变。"},{"id":"A21","source":"brief.md","text":"A21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Omp => \"Oh My Pi\"` 标签与上游文案/字段删改。"},{"id":"A22","source":"brief.md","text":"A22: 上游应用排序与 fork 侧栏面板可见性并存：`settings.appOrder` 可往返序列化（camelCase），应用页拖拽后侧栏顺序跟随；`VisibleSidebarPanels` 仍能隐藏 MCP/Skills/会话/Prompts 全局项；两者同时生效时先按 `orderAppIds(settings?.appOrder)` 排序再按 `visibleApps` 过滤，全局项按 `visibleSidebarPanels` 过滤。"},{"id":"A23","source":"brief.md","text":"A23: 上游本轮其余改动在 fork 落地后可用：应用页已安装/未安装分组与拖拽、Pi/omp 折叠高级选项与拉取模型弹窗、Kimi 官方账号模型编辑与无套餐提示、托管 ChatGPT 浏览器登录（`prost` 依赖）、agy 原生用量模型、Claude Copilot 自动协议路由提示（适配到 fork 的 `EndpointField.rightSlot` 布局）、Linux 窗口拖动/缩放、用量 tab 计数与 DeepSeek 空余额语义、托盘额度文案、土耳其语、预设模型刷新与 EveryAPI 移除、`src/whats-new/4.0.20.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"},{"id":"A25","source":"brief.md","text":"A25: schema 24 升级路径正确：模拟上游 v23 形状（有 `enabled_omp`、无 `enabled_kimi`）→ 24 后两表有 `enabled_kimi` 且 `mcp_servers` 保留 `enabled_omp`；模拟 fork v23 形状（有 `enabled_kimi`、无 `enabled_omp`）→ 24 后 `mcp_servers` 有 `enabled_omp`、`skills` 仍无 `enabled_omp`；重复调用幂等；既有 v21/v22 幂等用例保持通过。"}],"children":null,"formalHash":"b34ad12531efe59343964ddd5cee5c5f7933b0a7c6d00018fcd78e6786b8a4b4","shapeConfirmationHash":"0a4c2472b2f4f5e4059faa3417d91b94c52a7617ce4e8c7bd90b3157cba8e181","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}},"proposalHash":"0cacdf85e95cabfd0231639be85d38ee754b0565cc3272e210f79bd6a67b9119","choices":["approved","rejected"],"results":{},"decision":{"id":"3d6a2ec49f6bf37e80f5bfef383448fa0af94dea193d27863e49caa98ab930b4","choice":"approved","proposalHash":"0cacdf85e95cabfd0231639be85d38ee754b0565cc3272e210f79bd6a67b9119"}},{"id":"sync-upstream-v420:5","stepId":"build.resume","sequence":5,"status":"cancelled","proposal":{"activation":{"failedBuilderActionId":"sync-upstream-v420:4"},"input":{"artifactRootRef":"docs","name":"sync-upstream-v420"},"outputs":{"build.builder":{"summary":"Builder 在验证阶段回填了