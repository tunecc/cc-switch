型直达、右键置顶/置底与新建插入第二位、逐模型连通性测试、双官网链接、跨应用导入、fork README、测试稳定性修正均仍在且可检索到。"},{"id":"A15","source":"brief.md","text":"**文档同步**：`docs/HOW_TO_REBASE_UPSTREAM.md` §4 共享文件表按本轮结果修订并新增 §4.9；归档时 `docs/comet/specs/upstream-sync/spec.md` 重写为 v4.0.22 轮完整状态；`docs/comet/specs/database-schema-migrations/spec.md` 登记 schema 25 与新增迁移臂。"},{"id":"A16","source":"brief.md","text":"**交付边界与配置保护**：Build/Verify 期间不执行任何远端写操作；归档后推送 `main` 与 `v4.0.22-1` 前单独取得用户授权；`.comet/config.yaml` 未被修改。"}],"children":null,"formalHash":"c1bcc91ca5fbdde56f356bc7c51d280da2a9a875ec9e525b9edef0b5ca4fa2b3","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"eaad004ca4b716e47c0f4cba6839de5880046cfcfaba53951095af21018fb0ff","contractHash":"0d70f4c2989560e52a9b0b5213c98de16ad0e06f528043cf9cc9321f5c1639f1","inputHash":"97cdc7d0af4fdee950605bb6fef3ad1c6db52de6f9852fd280d2582ffd2ac309","legacyFingerprint":"3b24e6b6f0c1ecc375e92896e07cfbdf889cc1563138415f365ed97acb0f8131","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"9b9107b6cdf5d1e25a7dc8b4eb88844955fe21b25ba5b747d316d3f53d7ac29c","contractHash":"1992ffd0984ffc40af05d9d3fdac27f09b39cbff385353db4aff2716c81f85c9","inputHash":"6129e73c1a6c3e73cae88371c2b7a75eee0cc9125c6b75c5ffdd347f7c234ffa","legacyFingerprint":"d64cb83bd0183d088e9a935bf5ddcebe7150d95ba07ed642cfc64bed07339557","source":"specs/upstream-sync/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"821f1b42cba7b20ffd0cd067a5cd12e5bae7721ed80900fffe9459cd3c3ed778","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}},{"sequence":12,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"**基线正确**：`git merge-base main v4.0.22` 等于 `b76426741ef93069e2f374ac01ca7ef5760e1d0e`（`v4.0.22^{}`），且 `git log --format='%an <%ae>' v4.0.22..main | sort -u` 只输出 `Tune <17