t":"**基线正确**：`git merge-base main v4.0.22` 等于 `b76426741ef93069e2f374ac01ca7ef5760e1d0e`（`v4.0.22^{}`），且 `git log --format='%an <%ae>' v4.0.22..main | sort -u` 只输出 `Tune <176898395+tunecc@users.noreply.github.com>`。"},{"id":"A2","source":"brief.md","text":"**重放完整**：同步前安全分支 `pre-sync-v422` 指向 `bce5bbceeda8866e485a3601ae482f7b92af40b3`；重放后 `git rev-list --count v4.0.22..HEAD` 与 183 的差值只来自被 git 判空丢弃的提交和本轮新增提交，逐条登记；重放前后提交主题序列逐行 diff 为 0 行；patch-id 差异逐个归类为「逐字相同 / 仅 hunk 位移 / 冲突停车」，不存在 fork 语义丢失。"},{"id":"A3","source":"brief.md","text":"**上游零丢失**：按四 ref 行多重集口径对 228 个上游改动文件复算，非重叠的 183 个上游文件在 fork 侧缺失行为 0；重叠面缺失行逐行归因，只允许 README 整文件替换、四个版本文件 `4.0.22-1` 取代、以及合并等价的布局/分支改写。"},{"id":"A4","source":"brief.md","text":"**DSH 可用**：`dsh` 出现在应用列表、侧栏、MCP/Skills 开关、可见应用设置与后端 `AppType` 全部匹配臂中；DSH 页可添加/编辑/删除 live 托管供应商，模型编辑器使用 `dsh` 方言，账号预设 `DeepSeek` 进入账号登录组并可跳转授权中心；DSH 的 Web/Desktop 配置、账号登录、用量导入与 MCP 配置可读写，相关前后端测试通过。"},{"id":"A5","source":"brief.md","text":"**终端增强落地**：打开的终端会在生成参数之后追加用户自定义参数（按用户 shell 解析引号，批量变量原样透传），可选择跳过权限提示；Codex 供应商卡在满足 `terminalAvailable` 时可直接打开终端；Claude/agy 既有隔离语义与 fork 卡片图标入口不变。"},{"id":"A6","source":"brief.md","text":"**上游功能与修复落地**：用量（OMP/DSH 导入、非当前供应商余额刷新、Claude 账号额度、MiniMax 周窗口、错误信息上限）、代理（xAI include、Gemini 三处、WebSearch blocked_domains、Copilot 原生 Messages、常量时间 token、x-api-key、回环守卫）、Skills（打开目录/复制名称/发现文档/增量发现）、WebDAV 清空配置、live 配置读取失败提示、Kimi 安装器重跑、CLI 无版本判定、TOML 数组表头、Claude Desktop 模型顺序、AGY transcript 修复均可从代码与测试中验证。`ed494fbc7` 的 OpenCode V2 baseURL 修复登记为**不适用**：它只改 `src-tauri/src/services/stream_check.rs`，而该供应商卡探测链路已由 fork 移除（`c618f2ab3`），文件保持未编译孤儿状态——`services/mod.rs` 不声明 `stream_check`、`stream_check_provider` 未注册、OpenCode 不在 `TargetBuilder::for_app` 与 `shouldShowTestEntry` 范围内；该项不要求可用功能或测试覆盖。"},{"id":"A7","source":"brief.md","text":"**Schema 25 正确**：`SCHEMA_VERSION == 25`；`mcp_servers` 与 `skills` 均含 `enabled_dsh`，`session_log_sync` 含 `parser_state`；23→24 臂合并上游列并 set 24，新 24→25 臂幂等补齐三列并 set 25；上游 v4.0.22 的 24 库与 fork v4.0.21 的 24 库都能升到 25；迁移与 `create_tables` 测试通过。"},{"id":"A8","source":"brief.md","text":"**托盘契约不变**：`tray::handle_tray_icon_event` 内保持 fork 四条分支（面板样式左键且面板未显示切换主窗口、其余面板切换；原生菜单样式左键切换主窗口、右键标记反馈后交系统菜单），Windows 第三方宿主经 `tray_compat` 补发的点击走同一函数；`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`，`native_menu_on_left_click` 不复活，`tray_left_click_never_opens_the_menu` 护栏通过；绑号 Claude 账号额度进入托盘用量来源。"},{"id":"A9","source":"brief.md","text":"**更新器仍禁用**：`tauri_plugin_updater`/`updater_builder` 零命中，`Cargo.toml`/`package.json` 无 updater 依赖，`createUpdaterArtifacts` 为 `false`，`install_update_and_restart` 与 `check_app_update_available` 保持空壳。"},{"id":"A10","source":"brief.md","text":"**预设口径**：六个上游预设目录（含 Pi 派生到 DSH）内容按上游落地；fork 构建继续只保留白名单条目，DSH 白名单为 `[\"Ollama\",\"LM Studio\",\"vLLM\"]`；账号预设 `DeepSeek` 不参与目录过滤；预设 `id` 仍按原始数组下标编号，白名单过滤在编号之后执行；`forkOfficialAllowlist` 补齐 `dsh` 键且类型检查通过。"},{"id":"A11","source":"brief.md","text":"**本地化正确**：4 个既有 locale 合并上游新增/删除/改写键并保留 fork 键段，按对象作用域查重为 0 重复；`tr.json` 整文件取上游；无残留的已删除键引用。"},{"id":"A12","source":"brief.md","text":"**版本统一**：`package.json`、`src-tauri/tauri.conf.json`、`src-tauri/Cargo.toml`、`src-tauri/Cargo.lock` 的 `cc-switch` 条目均为 `4.0.22-1`，无其他版本号残留。"},{"id":"A13","source":"brief.md","text":"**冲突收敛**：45 个重叠文件逐个按 §3 规则合并，没有整文件取一侧；`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 零命中。"},{"id":"A14","source":"brief.md","text":"**fork 魔改保留**：DevPanel/`IS_FORK_BUILD`、侧栏面板可见性、模型徽章与快捷切换、Claude 兜底模型直达、右键置顶/置底与新建插入第二位、逐模型连通性测试、双官网链接、跨应用导入、fork README、测试稳定性修正均仍在且可检索到。"},{"id":"A15","source":"brief.md","text":"**文档同步**：`docs/HOW_TO_REBASE_UPSTREAM.md` §4 共享文件表按本轮结果修订并新增 §4.9；归档时 `docs/comet/specs/upstream-sync/spec.md` 重写为 v4.0.22 轮完整状态；`docs/comet/specs/database-schema-migrations/spec.md` 登记 schema 25 与新增迁移臂。"},{"id":"A16","source":"brief.md","text":"**交付边界与配置保护**：Build/Verify 期间不执行任何远端写操作；归档后推送 `main` 与 `v4.0.22-1` 前单独取得用户授权；`.comet/config.yaml` 未被修改。"}],"children":null,"formalHash":"c1bcc91ca5fbdde56f356bc7c51d280da2a9a875ec9e525b9edef0b5ca4fa2b3","semantic