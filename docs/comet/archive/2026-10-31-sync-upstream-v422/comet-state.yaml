sh` 出现在应用列表、侧栏、MCP/Skills 开关、可见应用设置与后端 `AppType` 全部匹配臂中；DSH 页可添加/编辑/删除 live 托管供应商，模型编辑器使用 `dsh` 方言，账号预设 `DeepSeek` 进入账号登录组并可跳转授权中心；DSH 的 Web/Desktop 配置、账号登录、用量导入与 MCP 配置可读写，相关前后端测试通过。"},{"id":"A5","source":"brief.md","text":"**终端增强落地**：打开的终端会在生成参数之后追加用户自定义参数（按用户 shell 解析引号，批量变量原样透传），可选择跳过权限提示；Codex 供应商卡在满足 `terminalAvailable` 时可直接打开终端；Claude/agy 既有隔离语义与 fork 卡片图标入口不变。"},{"id":"A6","source":"brief.md","text":"**上游功能与修复落地**：用量（OMP/DSH 导入、非当前供应商余额刷新、Claude 账号额度、MiniMax 周窗口、错误信息上限）、代理（xAI include、Gemini 三处、WebSearch blocked_domains、Copilot 原生 Messages、常量时间 token、x-api-key、回环守卫）、Skills（打开目录/复制名称/发现文档/增量发现）、WebDAV 清空配置、live 配置读取失败提示、Kimi 安装器重跑、CLI 无版本判定、OpenCode V2 baseURL、TOML 数组表头、Claude Desktop 模型顺序、AGY transcript 修复均可从代码与测试中验证。"},{"id":"A7","source":"brief.md","text":"**Schema 25 正确**：`SCHEMA_VERSION == 25`；`mcp_servers` 与 `skills` 均含 `enabled_dsh`，`session_log_sync` 含 `parser_state`；23→24 臂合并上游列并 set 24，新 24→25 臂幂等补齐三列并 set 25；上游 v4.0.22 的 24 库与 fork v4.0.21 的 24 库都能升到 25；迁移与 `create_tables` 测试通过。"},{"id":"A8","source":"brief.md","text":"**托盘契约不变**：`tray::handle_tray_icon_event` 内保持 fork 四条分支（面板样式左键且面板未显示切换主窗口、其余面板切换；原生菜单样式左键切换主窗口、右键标记反馈后交系统菜单），Windows 第三方宿主经 `tray_compat` 补发的点击走同一函数；`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`，`native_menu_on_left_click` 不复活，`tray_left_click_never_opens_the_menu` 护栏通过；绑号 Claude 账号额度进入托盘用量来源。"},{"id":"A9","source":"brief.md","text":"**更新器仍禁用**：`tauri_plugin_updater`/`updater_builder` 零命中，`Cargo.toml`/`package.json` 无 updater 依赖，`createUpdaterArtifacts` 为 `false`，`install_update_and_restart` 与 `check_app_update_available` 保持空壳。"},{"id":"A10","source":"brief.md","text":"**预设口径**：六个上游预设目录（含 Pi 派生到 DSH）内容按上游落地；fork 构建继续只保留白名单条目，DSH 白名单为 `[\"Ollama\",\"LM Studio\",\"vLLM\"]`；账号预设 `DeepSeek` 不参与目录过滤；预设 `id` 仍按原始数组下标编号，白名单过滤在编号之后执行；`forkOfficialAllowlist` 补齐 `dsh` 键且类型检查通过。"},{"id":"A11","source":"brief.md","text":"**本地化正确**：4 个既有 locale 合并上游新增/删除/改写键并保留 fork 键段，按对象作用域查重为 0 重复；`tr.json` 整文件取上游；无残留的已删除键引用。"},{"id":"A12","source