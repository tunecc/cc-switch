te_tables` 测试通过。"},{"id":"A8","source":"brief.md","text":"**托盘契约不变**：`tray::handle_tray_icon_event` 内保持 fork 四条分支（面板样式左键且面板未显示切换主窗口、其余面板切换；原生菜单样式左键切换主窗口、右键标记反馈后交系统菜单），Windows 第三方宿主经 `tray_compat` 补发的点击走同一函数；`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`，`native_menu_on_left_click` 不复活，`tray_left_click_never_opens_the_menu` 护栏通过；绑号 Claude 账号额度进入托盘用量来源。"},{"id":"A9","source":"brief.md","text":"**更新器仍禁用**：`tauri_plugin_updater`/`updater_builder` 零命中，`Cargo.toml`/`package.json` 无 updater 依赖，`createUpdaterArtifacts` 为 `false`，`install_update_and_restart` 与 `check_app_update_available` 保持空壳。"},{"id":"A10","source":"brief.md","text":"**预设口径**：六个上游预设目录（含 Pi 派生到 DSH）内容按上游落地；fork 构建继续只保留白名单条目，DSH 白名单为 `[\"Ollama\",\"LM Studio\",\"vLLM\"]`；账号预设 `DeepSeek` 不参与目录过滤；预设 `id` 仍按原始数组下标编号，白名单过滤在编号之后执行；`forkOfficialAllowlist` 补齐 `dsh` 键且类型检查通过。"},{"id":"A11","source":"brief.md","text":"**本地化正确**：4 个既有 locale 合并上游新增/删除/改写键并保留 fork 键段，按对象作用域查重为 0 重复；`tr.json` 整文件取上游；无残留的已删除键引用。"},{"id":"A12","source":"brief.md","text":"**版本统一**：`package.json`、`src-tauri/tauri.conf.json`、`src-tauri/Cargo.toml`、`src-tauri/Cargo.lock` 的 `cc-switch` 条目均为 `4.0.22-1`，无其他版本号残留。"},{"id":"A13","source":"brief.md","text":"**冲突收敛**：45 个重叠文件逐个按 §3 规则合并，没有整文件取一侧；`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 零命中。"},{"id":"A14","source":"brief.md","text":"**fork 魔改保留**：DevPanel/`IS_FORK_BUILD`、侧栏面板可见性、模型徽章与快捷切换、Claude 兜底模型直达、右键置顶/置底与新建插入第二位、逐模型连通性测试、双官网链接、跨应用导入、fork README、测试稳定性修正均仍在且可检索到。"},{"id":"A15","source":"brief.md","text":"**文档同步**：`docs/HOW_TO_REBASE_UPSTREAM.md` §4 共享文件表按本轮结果修订并新增 §4.9；归档时 `docs/comet/specs/upstream-sync/spec.md` 重写为 v4.0.22 轮完整状态；`docs/comet/specs/database-schema-migrations/spec.md` 登记 schema 25 与新增迁移臂。"},{"id":"A16","source":"brief.md","text":"**交付边界与配置保护**：Build/Verify 期间不执行任何远端写操作；归档后推送 `main` 与 `v4.0.22-1` 前单独取得用户授权；`.comet/config.yaml` 未被修改。"}],"children":null,"formalHash":"fd6a20480822845566b3623dd22333286433ea8b4c45d79c243007518b