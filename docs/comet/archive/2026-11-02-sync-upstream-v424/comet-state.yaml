        text: locale duplicate-key scan (object scope)
        truncated: false
      argv_display:
        - text: -c
          truncated: false
        - text: |-
            import json, collections, sys
            def dup(path):
                found = []
                def hook(pairs):
                    counts = collections.Counter(k for k, _ in pairs)
                    found.extend(k for k, n in counts.items() if n > 1)
                    return dict(pairs)
                with open(path, encoding="utf-8") as fh:
                    json.load(fh, object_pairs_hook=hook)
                return found
            total = 0
            for loc in ("en", "ja", "zh", "zh-TW", "tr"):
                p = f"src/i18n/locales/{loc}.json"
                d = dup(p)
                total += len(d)
                print(loc, "dup", len(d), d[:5])
            sys.exit(0 if total == 0 else 1)
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
