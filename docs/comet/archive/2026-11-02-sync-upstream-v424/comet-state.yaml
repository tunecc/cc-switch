    - id: landing-fidelity
      name:
        text: four-ref landing fidelity (upstream v4.0.22 / v4.0.24 / pre-sync-v424 /
          HEAD)
        truncated: false
      argv_display:
        - text: -c
          truncated: false
        - text: |
            
            import re,subprocess,sys
            from collections import Counter
            BASE="v4.0.22"; TARGET="c0189078a"; PRE="pre-sync-v424"
            SYM=re.compile(r"^[\s{}()\[\];,.<>/\\'\"`:=*#!&|+-]*$")
            def sh(a): return subprocess.run(a,capture_output=True,text=True,check=True).stdout
            def adds(a,b,p):
                return [l[1:] for l in sh(["git","diff","--unified=0",f"{a}..{b}","--",p]).splitlines() if l.startswith("+") and not l.startswith("+++")]
            def norm(ls):
                o=[]
                for r in ls:
                    t=r.strip()
                    if t.endswith(","): t=t[:-1]
                    if t and not SYM.match(t): o.append(t)
                return o
            def head(p):
                r=subprocess.run(["git","show",f"HEAD:{p}"],capture_output=True)
                return "" if r.returncode else r.stdout.decode("utf-8","replace")
            files=[f for f in sh(["git","diff","--name-only",f"{BASE}..{TARGET}"]).split() if f]
            fset=set(sh(["git","diff","--name-only",f"{BASE}..{PRE}"]).split())
            ALLOW={"README.md","package.json","src-tauri/tauri.conf.json","src-tauri/Cargo.toml","src-tauri/Cargo.lock",".github/workflows/release.yml","src/components/providers/forms/ClaudeFormFields.tsx"}
            bad=[]; nonoverlap=[]; mu=0; mf=0
            for p in files:
                up=Counter(norm(adds(BASE,TARGET,p))); fk=Counter(norm(adds(BASE,PRE,p))) if p in fset else Counter()
                fin=Counter(norm(head(p).splitlines()))
                du=df=0
                mup=up-fin; mfk=fk-fin
                mu+=sum(mup.values()); mf+=sum(mfk.values())
                if p not in fset and mup: nonoverlap.append((p,sum(mup.values())))
                if (mup or mfk) and p not in ALLOW and p not in fset: bad.append(p)
                if (mup or mfk) and p in ALLOW and p not in fset: bad.append(p)
            print("upstream_missing",mu,"fork_missing",mf)
            print("non_overlap_missing",nonoverlap)
            if bad: print("UNATTRIBUTED",bad)
            sys.exit(0 if not bad and not nonoverlap else 1)
