、`src-tauri/tests/kimi_commands.rs`）；如遇环境性失败，按规格固定口径取证并记录，不扩大跳过列表。"},{"id":"A14","source":"brief.md","text":"A14: 落地保真核对通过：对 47 个重叠文件按固定四 ref 归一化行多重集算法（`v4.0.18`、`v4.0.19`、`pre-sync-v419`、最终 `HEAD`）逐文件计算「上游新增行缺失」与「fork 新增行缺失」，结果与逐行归类记录在规格中；计算在本轮全部最终态提交落完之后执行；确有意图取舍时逐行说明理由并带重数（`README.md` 的整文件 fork 版本、`4.0.19-1` 版本号行属已知取舍），未说明的非零缺失即视为丢语义缺陷。"},{"id":"A15","source":"brief.md","text":"A15: 4 个既有 locale JSON（`zh`、`en`、`ja`、`zh-TW`）逐文件可解析且按对象作用域统计无任何同名重复键，fork 键段按 key 逐个比对全部在位；上游本轮 52 个新键在 4 个 locale 全部在位且取值与 `v4.0.19` 逐字节一致；上游删除的 8 个键在 4 个 locale 均不再残留（fork 无引用）；fork 专属覆盖 `provider.connectivityCheck` 与 `settings.general.trayStyleHelp` 保持 fork 文案；`tr.json` 与 `git show v4.0.19:src/i18n/locales/tr.json` 逐字节一致（上游 `tr` 自身比 `en` 少 16 个新增键、少 1 个删除键，不补）。"},{"id":"A16","source":"brief.md","text":"A16: `tauri_plugin_updater`/`updater_builder` 在全仓 `src-tauri` 命中数仍为 0；`tauri-plugin-updater` 未回到 `src-tauri/Cargo.toml` 依赖表；`createUpdaterArtifacts` 仍为 `false`；`install_update_and_restart` 仍为空壳。"},{"id":"A17","source":"brief.md","text":"A17: 上游 Kimi 能力在 fork 落地后可用：12 个 `APP_IDS` 含 kimi、Apps 页可安装/打开 Kimi Code、Kimi 表单可用（官方账号登录 + 预设目录 + 模型表/拉取模型）、授权中心 Kimi 分组与额度、Kimi 会话/用量归属、MCP/Skills kimi 开关、`enabled_kimi` 持久化与迁移、上游新增测试全部通过；Kimi 官方卡不可复制/不可删、非官方卡无连通性测试入口（与上游一致）。"},{"id":"A18","source":"brief.md","text":"A18: Q1 的 Kimi 预设白名单生效：`forkOfficialAllowlist.kimi` 严格等于 `[\"Kimi\", \"Kimi Global\", \"Kimi For Coding\", \"Kimi For Coding Global\"]`；Kimi 表单的预设目录按名称过滤，官方账号卡 `Kimi Official`（id `kimi-official-account`）始终保留；目录预设 id 仍为 `String(原始数组下标)`，过滤不得改变编号；三条本机推理预设（`Ollama`/`LM Studio`/`vLLM`）以及赞助商/聚合站/`Meta Model API` 等未列入白名单的 Kimi 预设在 fork 构建的所有 Kimi 入口均不可见；其他 app 的白名单不变。"},{"id":"A19","source":"brief.md","text":"A19: Q2 的跨应用导入口径生效：Kimi 仅作为导入来源——`readImportableProviderFields(\"kimi\", …)` 读出 `provider.base_url`/`provider.api_key`，身份字段（名称/备注/官网）照常复制，`defaultModel` 为空且 `targetSupportsDefaultModel(\"kimi\") === false`；`KimiProviderForm` 不渲染 `ProviderImportEntry`，Kimi 不作为导入目标；官方账号卡作为来源时连接字段为空、身份字段仍可复制；其余 11 个应用的导入行为不变。"},{"id":"A20","source":"brief.md","text":"A20: Q3 的 Kimi 卡片模型口径生效：Kimi 不进入 fork 的 `MODEL_CAPABLE_APPS`/模型徽章/快捷切换弹窗，卡片维持上游「更多 → 设为默认」与表单模型表；4 个既有 app 的徽章与快捷切换行为不变。"},{"id":"A21","source":"brief.md","text":"A21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Kimi => \"Kimi Code\"` 标签。"},{"id":"A22","source":"brief.md","text":"A22: 上游用量页重构在 fork 落地后可用：`UsageDataSourcesSheet.tsx` 已删除且无引用，`UsageSettingsSheet`/`ChecklistMenu`/`RequestLogColumnsMenu`/`usageRange` 在位，用量页分页、趋势粒度、同步状态与新设置面板工作；8 个删除键无残留引用。"},{"id":"A23","source":"brief.md","text":"A23: 上游本轮其余改动在 fork 落地后可用：Kimi 安装器（`KIMI_INSTALL_*`/npm 命令）、卡片更多菜单默认模型子菜单（OpenCode/OpenClaw）、Pi providerKey 常显与重复校验、BuyToken/V-API 赞助商预设与 locale、`providerPreset.loginWith.kimi`、`src/whats-new/4.0.19.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"}],"children":null,"formalHash":"5ef9d6c46e0cf9b16cd61a358ad54891d0da322dc5d606898c5f71268bd2deec","shapeConfirmationHash":"6df16da74c025648a772885f686d60cf1e35a0809229d8311d29992b8a8de987","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}}}},"shape.prepare":{"sequence":1,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: rebase 后 `git merge-base main v4.0.19` 等于 `d8983bb`（tag `v4.0.19` 剥离出的提交），`git log v4.0.19..main` 只包含 fork 提交（作者 `Tune`），不含任何上游提交。"},{"id":"A2","source":"brief.md","text":"A2: 重放前 `git rev-list --count v4.0.18..pre-sync-v419` == 178；重放后 `git rev-list --count v4.0.19..HEAD` 与之的差异只来自「被 git 判定为空而丢弃」或「本轮新增提交」，逐条记录；`git log --format='%s' --reverse` 主题序列逐行 diff 为 0 行；p