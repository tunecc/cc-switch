g(原始数组下标)`，过滤不得改变编号；三条本机推理预设（`Ollama`/`LM Studio`/`vLLM`）以及赞助商/聚合站/`Meta Model API` 等未列入白名单的 Kimi 预设在 fork 构建的所有 Kimi 入口均不可见；其他 app 的白名单不变。"},{"id":"A19","source":"brief.md","text":"A19: Q2 的跨应用导入口径生效：Kimi 仅作为导入来源——`readImportableProviderFields(\"kimi\", …)` 读出 `provider.base_url`/`provider.api_key`，身份字段（名称/备注/官网）照常复制，`defaultModel` 为空且 `targetSupportsDefaultModel(\"kimi\") === false`；`KimiProviderForm` 不渲染 `ProviderImportEntry`，Kimi 不作为导入目标；官方账号卡作为来源时连接字段为空、身份字段仍可复制；其余 11 个应用的导入行为不变。"},{"id":"A20","source":"brief.md","text":"A20: Q3 的 Kimi 卡片模型口径生效：Kimi 不进入 fork 的 `MODEL_CAPABLE_APPS`/模型徽章/快捷切换弹窗，卡片维持上游「更多 → 设为默认」与表单模型表；4 个既有 app 的徽章与快捷切换行为不变。"},{"id":"A21","source":"brief.md","text":"A21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Kimi => \"Kimi Code\"` 标签。"},{"id":"A22","source":"brief.md","text":"A22: 上游用量页重构在 fork 落地后可用：`UsageDataSourcesSheet.tsx` 已删除且无引用，`UsageSettingsSheet`/`ChecklistMenu`/`RequestLogColumnsMenu`/`usageRange` 在位，用量页分页、趋势粒度、同步状态与新设置面板工作；8 个删除键无残留引用。"},{"id":"A23","source":"brief.md","text":"A23: 上游本轮其余改动在 fork 落地后可用：Kimi 安装器（`KIMI_INSTALL_*`/npm 命令）、卡片更多菜单默认模型子菜单（OpenCode/OpenClaw）、Pi providerKey 常显与重复校验、BuyToken/V-API 赞助商预设与 locale、`providerPreset.loginWith.kimi`、`src/whats-new/4.0.19.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"}],"children":null,"formalHash":"5ef9d6c46e0cf9b16cd61a358ad54891d0da322dc5d606898c5f71268bd2deec","shapeConfirmationHash":"6df16da74c025648a772885f686d60cf1e35a0809229d8311d29992b8a8de987","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}}}},"shape.prepare":{"sequence":1,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: rebase 后 `git merge-base main v4.0.19` 等于 `d8983bb`（tag `v4.0.19` 剥离出的提交），`git log v4.0.19..main` 只包含 fork 提交（作者 `Tune`），不含任何上游提交。"},{"id":"A2","source":"brief.md","text":"A2: 重放前 `git rev-list --count v4.0.18..pre-sync-v419` == 178；重放后 `git rev-list --count v4.0.19..HEAD` 与之的差异只来自「被 git 判定为空而丢弃」或「本轮新增提交」，逐条记录；`git log --format='%s' --reverse` 主题序列逐行 diff 为 0 行；patch-id 对照走 stdin（`git show <c> | git patch-id --stable`），不同的提交逐个归类为「仅 hunk 位移」或「冲突停车」，冲突停车逐条记录归属与解法。"},{"id":"A3","source":"brief.md","text":"A3: 47 个重叠文件的冲突解决符合 `docs/HOW_TO_REBASE_UPSTREAM.md` §3 与完整目标规格的逐文件叠加要求：两侧语义并存、无整文件取一侧（高危面为 `database/schema.rs`、`lib.rs`、`commands/misc.rs`、`services/provider/mod.rs`、`ProviderForm.tsx`、`ProviderCard.tsx`、`ProviderList.tsx`、`App.tsx`、4 个 locale、4 个版本与锁文件、`README.md`）。"},{"id":"A4","source":"brief.md","text":"A4: `package.json`、`src-tauri/tauri.conf.json`、`src-tauri/Cargo.toml`、`src-tauri/Cargo.lock` 的版本号均为 `4.0.19-1`；`src-tauri/src/database/mod.rs` 的 `SCHEMA_VERSION` == 23；迁移链：v18→v19（fork `website_url_2` + 上游 mcode 并存）、v19→v20（上游 pi）、v20→v21（fork 修复 mcode/pi + 上游 `enabled_agy`）、v21→v22（fork 幂等补 `enabled_agy` + 上游 `enabled_kimi` 合并为一步）、v22→v23（幂等补 `enabled_kimi`）全部在位；`create_tables` 的 `mcp_servers`/`skills` 含 `enabled_kimi`；上游迁移测试改到 23，新增 v22→v23 用例。"},{"id":"A5","source":"brief.md","text":"A5: 完整目标规格「fork 魔改保留清单」每一项在同步后仍然存在且可用：产品名 CC Switch 与 DevPanel、侧边面板可见性、模型徽章与快捷切换（claude/codex/gemini/grokbuild）、Claude 兜底模型直达区与 1M 全选、右键置顶/置底与新建插入第二位、官方预设过滤（含 Q1 的 kimi 条目）、逐模型连通性测试（`lib.rs` 两个命令注册在位，且 Kimi 维持上游的测试入口关闭）、双官网链接、跨应用导入（含 Q2 的 Kimi 口径）、禁用应用内更新器、README fork 说明、fork CI。"},{"id":"A6","source":"brief.md","text":"A6: rebase 后 `.comet/config.yaml` 仍为 fork 当前配置（`default_workflow: native`，`workflows` 含 native 与 classic），fork 专属白名单文件未被上游或重放改写。"},{"id":"A7","source":"brief.md","text":"A7: `docs/HOW_TO_REBASE_UPSTREAM.md` 已按本轮同步结果修订（含 §4.6、`lib.rs`/`database/schema.rs`/`co