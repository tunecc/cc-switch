md","text":"A23: 上游本轮其余改动在 fork 落地后可用：Kimi 安装器（`KIMI_INSTALL_*`/npm 命令）、卡片更多菜单默认模型子菜单（OpenCode/OpenClaw）、Pi providerKey 常显与重复校验、BuyToken/V-API 赞助商预设与 locale、`providerPreset.loginWith.kimi`、`src/whats-new/4.0.19.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"}],"children":null,"formalHash":"5ef9d6c46e0cf9b16cd61a358ad54891d0da322dc5d606898c5f71268bd2deec","shapeConfirmationHash":"6df16da74c025648a772885f686d60cf1e35a0809229d8311d29992b8a8de987","specChanges":[{"capability":"upstream-sync","operation":"modify","source":"specs/upstream-sync/spec.md"}]}}},"children":[],"lineage":[]},"sourceRevision":7,"sourceHash":"b940f9e6975630db85fb5cb1314aeace824b545b100be245c34c22683b5cab51"}
