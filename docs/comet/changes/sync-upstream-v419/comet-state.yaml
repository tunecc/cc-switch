unt`）始终保留；目录预设 id 仍为 `String(原始数组下标)`，过滤不得改变编号；三条本机推理预设（`Ollama`/`LM Studio`/`vLLM`）以及赞助商/聚合站/`Meta Model API` 等未列入白名单的 Kimi 预设在 fork 构建的所有 Kimi 入口均不可见；其他 app 的白名单不变。"},{"id":"A19","source":"brief.md","text":"A19: Q2 的跨应用导入口径生效：Kimi 仅作为导入来源——`readImportableProviderFields(\"kimi\", …)` 读出 `provider.base_url`/`provider.api_key`，身份字段（名称/备注/官网）照常复制，`defaultModel` 为空且 `targetSupportsDefaultModel(\"kimi\") === false`；`KimiProviderForm` 不渲染 `ProviderImportEntry`，Kimi 不作为导入目标；官方账号卡作为来源时连接字段为空、身份字段仍可复制；其余 11 个应用的导入行为不变。"},{"id":"A20","source":"brief.md","text":"A20: Q3 的 Kimi 卡片模型口径生效：Kimi 不进入 fork 的 `MODEL_CAPABLE_APPS`/模型徽章/快捷切换弹窗，卡片维持上游「更多 → 设为默认」与表单模型表；4 个既有 app 的徽章与快捷切换行为不变。"},{"id":"A21","source":"brief.md","text":"A21: **fork 左键契约的源码级回归护栏通过**：`src-tauri/src/tray.rs` 的 `tray_left_click_never_opens_the_menu` 用例在重放后仍成立（`apply_tray_style` 固定 `set_show_menu_on_left_click(false)`、`lib.rs` 的 builder 固定 `.show_menu_on_left_click(false)`），上游的 `native_menu_on_left_click` 辅助函数与其调用点在 fork 终态仍为零命中；`lib.rs` 的 `TrayIconEvent::Click` 分支保持 fork 四条分支语义；`tray.rs` 只新增 `AppType::Kimi => \"Kimi Code\"` 标签。"},{"id":"A22","source":"brief.md","text":"A22: 上游用量页重构在 fork 落地后可用：`UsageDataSourcesSheet.tsx` 已删除且无引用，`UsageSettingsSheet`/`ChecklistMenu`/`RequestLogColumnsMenu`/`usageRange` 在位，用量页分页、趋势粒度、同步状态与新设置面板工作；8 个删除键无残留引用。"},{"id":"A23","source":"brief.md","text":"A23: 上游本轮其余改动在 fork 落地后可用：Kimi 安装器（`KIMI_INSTALL_*`/npm 命令）、卡片更多菜单默认模型子菜单（OpenCode/OpenClaw）、Pi providerKey 常显与重复校验、BuyToken/V-API 赞助商预设与 locale、`providerPreset.loginWith.kimi`、`src/whats-new/4.0.19.json` 与 release notes。"},{"id":"A24","source":"brief.md","text":"A24: 冲突标记零命中：`git grep -I -l -e '^<<<<<<<' -e '^>>>>>>> ' HEAD -- src src-tauri tests docs README.md` 为 0（exit 1）。"}],"children":null,"formalHash":"5ef9d6c46e0cf9b16cd61a358ad54891d0da322dc5d606898c5f71268bd2deec","shapeConfirmationHash":"6df16da74c025648a772885f686d60cf1e35a0809229d8311d29992b8a8de987","specChanges":[{"capability":"upstream-sync","operation":"modify","sourc