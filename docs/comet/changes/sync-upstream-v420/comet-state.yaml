i/Cargo.toml`、`src-tauri/Cargo.lock` 的版本号均为 `4.0.20-1`；`src-tauri/src/database/mod.rs` 的 `SCHEMA_VERSION` == 24；迁移链：v18→v19（fork `website_url_2` + 上游 mcode 并存）、v19→v20（上游 pi）、v20→v21（fork 修复 mcode/pi + 上游 `enabled_agy`）、v21→v22（fork 幂等补 `enabled_agy` + 上游 `enabled_kimi` 合并）、v22→v23（fork 幂等补 `enabled_kimi` + 上游 `enabled_omp` 合并）、v23→v24（幂等补 `enabled_kimi`（两表）与 `enabled_omp`（仅 `mcp_servers`））全部在位；`create_tables` 的 `mcp_servers` 含 `enabled_agy`/`enabled_kimi`/`enabled_omp`，`skills` 含 `enabled_agy`/`enabled_kimi` 且不含 `enabled_omp`；上游迁移测试改用 `SCHEMA_VERSION` 常量，新增 v23→v24 两侧形状与幂等用例。"},{"id":"A5","source":"brief.md","text":"A5: 完整目标规格「fork 魔改保留清单」每一项在同步后仍然存在且可用：产品名 CC Switch 与 DevPanel、侧边面板可见性、模型徽章与快捷切换（claude/codex/gemini/grokbuild）、Claude 兜底模型直达区与 1M 全选、右键置顶/置底与新建插入第二位、官方预设过滤（含 Q1 的 `omp` 条目）、逐模型连通性测试（`lib.rs` 两个命令注册在位，且 omp 维持上游的测试入口关闭）、双官网链接、跨应用导入（含 Q2 的 omp 口径）、禁用应用内更新器、README fork 说明、fork CI。"},{"id":"A6","source":"brief.md","text":"A6: rebase 后 `.comet/config.yaml` 仍为 fork 当前配置（`default_workflow: native`，`workflows` 含 native 与 classic），fork 专属白名单文件未被上游或重放改写。"},{"id":"A7","source":"brief.md","text":"A7: `docs/HOW_TO_REBASE_UPSTREAM.md` 已按本轮同步结果修订（含 §4.7、`database/schema.rs`/`settings.rs`/`tray.rs`/`PiProviderForm.tsx`/`KimiProviderForm.tsx`/`ProviderList.tsx`/`App.tsx` 等行的新口径与 omp 白名单登记），全局与 change 内完整目标规格已重写为同步后的完整状态（含重放映射、冲突清单、落地保真核对与逐行归类），三处记录的数字与归属互相一致。"},{"id":"A8","source":"brief.md","text":"A8: `pnpm typecheck` 通过（零 `TS2300`，AppId/`VisibleApps`/`forkOfficialAllowlist`/`APP_ICON_MAP` 的 omp 字段无重复声明）。"},{"id":"A9","source":"brief.md","text":"A9: `pnpm test:unit` 通过，含上游本轮新增/改写用例（`ompProviderPresets`、`PiProviderForm`、`AppsPage`、`KimiProviderForm`、`ClaudeFormFields`、`ProviderList`、`AddProviderDialog`、`EditProviderDialog`、`ProviderPresetSelector`、`ClaudeDesktopProviderForm`、`ProviderForm.presetRows.golden`）与 fork 既有用例；时间敏感用例按既有 00:00–00:30 窗口口径处理。"},{"id":"A10","source":"brief.md","text":"A10: `pnpm format:check` 通过（手工拼接共享文件后必须本地 prettier 归一化）。"},{"id":"A11","source"